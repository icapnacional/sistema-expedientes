<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin - ICAP Nacional</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #fafafa; font-family: 'Inter', sans-serif; padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; }
    .card { background: white; border-radius: 16px; box-shadow: 0 6px 20px #0001; margin-bottom: 24px; padding: 32px; }
    .btn { background: #722F37; color: white; border: none; border-radius: 10px; padding: 12px 20px; font-weight: 600; cursor: pointer; }
    .form-group { text-align: left; margin: 16px 0; }
    label { display: block; margin-bottom: 8px; font-weight: 600; }
    input, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; }
    select[multiple] { height: 140px; }
    .alert { padding: 12px; border-radius: 8px; margin: 16px 0; display: none; }
    .alert-error { background: #fff5f5; color: #c00; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h2>👑 Panel de Administración</h2>
      <div id="authAlert" class="alert alert-error"></div>

      <form id="userForm">
        <div class="form-group">
          <label for="userEmail">Correo *</label>
          <input type="email" id="userEmail" required placeholder="usuario@icap.gob.ve">
        </div>
        <div class="form-group">
          <label for="userRol">Rol *</label>
          <select id="userRol" required>
            <option value="1">Administrador</option>
            <option value="2">Moderador</option>
            <option value="3">Usuario</option>
          </select>
        </div>
        <div class="form-group">
          <label for="estadosSelect">Estados *</label>
          <select id="estadosSelect" multiple size="6" required>
            <option value="Amazonas">Amazonas</option>
            <option value="Anzoátegui">Anzoátegui</option>
            <option value="Apure">Apure</option>
            <option value="Aragua">Aragua</option>
            <option value="Barinas">Barinas</option>
            <option value="Bolívar">Bolívar</option>
            <option value="Carabobo">Carabobo</option>
            <option value="Cojedes">Cojedes</option>
            <option value="Delta Amacuro">Delta Amacuro</option>
            <option value="Falcón">Falcón</option>
            <option value="Guárico">Guárico</option>
            <option value="Lara">Lara</option>
            <option value="Mérida">Mérida</option>
            <option value="Miranda">Miranda</option>
            <option value="Monagas">Monagas</option>
            <option value="Nueva Esparta">Nueva Esparta</option>
            <option value="Portuguesa">Portuguesa</option>
            <option value="Sucre">Sucre</option>
            <option value="Táchira">Táchira</option>
            <option value="Trujillo">Trujillo</option>
            <option value="La Guaira">La Guaira</option>
            <option value="Yaracuy">Yaracuy</option>
            <option value="Zulia">Zulia</option>
          </select>
        </div>
        <div class="form-group" id="modulosSection">
          <label for="modulosSelect">Módulos (Moderador)</label>
          <select id="modulosSelect" multiple size="6">
            <option value="rh">🧑‍💼 Recursos Humanos</option>
            <option value="analisis">🔍 Análisis</option>
            <option value="logistica">📦 Logística</option>
            <option value="dppc">🛡️ DPPC</option>
            <option value="legal">⚖️ Asesoría Legal</option>
            <option value="disciplinarios">📑 D.E. Disciplinarios</option>
            <option value="secretaria">📝 Secretaría</option>
          </select>
        </div>
        <button type="submit" class="btn">Crear Usuario</button>
      </form>

      <div class="card" style="margin-top:32px;">
        <h3>👥 Usuarios</h3>
        <div id="usuariosList"></div>
      </div>

      <button id="logoutBtn" class="btn" style="width:100%;">Cerrar Sesión</button>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const SUPABASE_URL = 'https://stwriaubepeugobgyxjt.supabase.co';
      const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN0d3JpYXViZXBldWdvYmd5eGp0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTQ3NDU0MDUsImV4cCI6MjA3MDMyMTQwNX0.3Rorn10j19M2nmmv03oSEwm-O-y0bsywAA8_CRR2O1g';
      const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      const userForm = document.getElementById('userForm');
      const userRol = document.getElementById('userRol');
      const modulosSection = document.getElementById('modulosSection');
      const authAlert = document.getElementById('authAlert');
      const logoutBtn = document.getElementById('logoutBtn');

      // Mostrar/ocultar módulos
      userRol.addEventListener('change', () => {
        modulosSection.style.display = userRol.value === '2' ? 'block' : 'none';
      });

      // 🔐 Verificar acceso
      async function checkAccess() {
        const {  { session } } = await supabase.auth.getSession();
        if (!session) {
          authAlert.textContent = 'Sesión no válida';
          authAlert.style.display = 'block';
          setTimeout(() => location.href = 'index.html', 2000);
          return false;
        }

        const {  perfil } = await supabase
          .from('usuarios_perfil')
          .select('rol_id')
          .eq('user_id', session.user.id)
          .single();

        if (!perfil || perfil.rol_id !== 1) {
          authAlert.textContent = 'Acceso denegado';
          authAlert.style.display = 'block';
          setTimeout(() => location.href = 'index.html', 2000);
          return false;
        }
        return true;
      }

      // ✅ Envío (con Edge Function)
      userForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('userEmail').value.trim();
        const rolId = parseInt(userRol.value);
        const estados = Array.from(document.getElementById('estadosSelect').selectedOptions).map(o => o.value);
        if (estados.length === 0) return alert('Seleccione al menos un estado');

        let modulos = [];
        if (rolId === 2) {
          modulos = Array.from(document.getElementById('modulosSelect').selectedOptions).map(o => o.value);
          if (modulos.length === 0) return alert('Seleccione al menos un módulo');
        }

        try {
          const {  { session } } = await supabase.auth.getSession();
          if (!session) throw new Error('Sesión inválida');

          // ✅ Llamada segura a Edge Function (con apikey)
          const res = await fetch(`${SUPABASE_URL}/functions/v1/create-user`, {
            method: 'POST',
            headers: {
              'Authorization': `Bearer ${session.access_token}`,
              'apikey': SUPABASE_ANON_KEY,  // ← 🔑 Obligatorio
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              email,
              rol_id: rolId,
              estados_asignados: estados,
              secciones_acceso: rolId === 2 ? modulos : null
            })
          });

          const data = await res.json();
          if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);

          alert(`✅ Usuario creado: ${email}`);
          userForm.reset();
          modulosSection.style.display = 'none';

        } catch (err) {
          alert('❌ ' + (err.message || 'Error'));
        }
      });

      logoutBtn.addEventListener('click', async () => {
        await supabase.auth.signOut();
        location.href = 'index.html';
      });

      if (await checkAccess()) {
        modulosSection.style.display = 'none';
      }
    });
  </script>
</body>
</html>
