<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin | ICAP Nacional - PNB</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #f5f7fa;
      color: #2d2d2d;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    .header {
      text-align: center;
      margin-bottom: 30px;
    }
    .header img {
      width: 80px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      color: #722F37;
    }
    .card {
      background: white;
      border-radius: 16px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
      padding: 32px;
      margin-bottom: 24px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #333;
    }
    input, select {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
    }
    select[multiple] {
      height: 180px;
    }
    .modules-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 8px;
    }
    .module-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .module-item input[type="checkbox"] {
      width: auto;
      margin: 0;
    }
    .btn {
      background: #722F37;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 14px 24px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn:hover {
      background: #5e262d;
    }
    .alert {
      padding: 12px;
      border-radius: 8px;
      margin: 16px 0;
      display: none;
    }
    .alert-success { background: #e6f7ee; color: #1a7f37; border: 1px solid #b7e8c7; }
    .alert-error { background: #fff5f5; color: #c00; border: 1px solid #ffd0d0; }
    .back-btn {
      background: #eee;
      color: #555;
    }
    .back-btn:hover {
      background: #ddd;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <img src="https://raw.githubusercontent.com/icapnacional/sistema-expedientes/main/Logo.png" alt="ICAP">
      <h1>Panel de Administración — Crear Usuario</h1>
    </div>

    <div class="card">
      <button class="btn back-btn" onclick="window.location.href='index.html'">← Volver al Panel</button>

      <div id="alertMessage" class="alert"></div>

      <form id="createUserForm">
        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" required placeholder="ejemplo@pn.gob.ve">
        </div>
        <div class="form-group">
          <label for="password">Contraseña (mín. 8 caracteres)</label>
          <input type="password" id="password" required minlength="8">
        </div>
        <div class="form-group">
          <label for="rol_id">Rol (solo para identificación)</label>
          <select id="rol_id" required>
            <option value="">-- Seleccionar --</option>
            <option value="1">Administrador</option>
            <option value="2">Moderador</option>
            <option value="3">Consultor</option>
          </select>
          <small style="display:block; margin-top:6px; color:#666;">⚠️ El rol NO define los módulos. Asigne módulos manualmente abajo.</small>
        </div>
        <div class="form-group">
          <label for="estados">Estados asignados (Ctrl/Cmd + clic para múltiples)</label>
          <select id="estados" multiple required>
            <option value="Amazonas">Amazonas</option>
            <option value="Anzoátegui">Anzoátegui</option>
            <option value="Apure">Apure</option>
            <option value="Aragua">Aragua</option>
            <option value="Barinas">Barinas</option>
            <option value="Bolívar">Bolívar</option>
            <option value="Carabobo">Carabobo</option>
            <option value="Cojedes">Cojedes</option>
            <option value="Delta Amacuro">Delta Amacuro</option>
            <option value="Distrito Capital">Distrito Capital</option>
            <option value="Falcón">Falcón</option>
            <option value="Guárico">Guárico</option>
            <option value="Lara">Lara</option>
            <option value="Mérida">Mérida</option>
            <option value="Miranda">Miranda</option>
            <option value="Monagas">Monagas</option>
            <option value="Nueva Esparta">Nueva Esparta</option>
            <option value="Portuguesa">Portuguesa</option>
            <option value="Sucre">Sucre</option>
            <option value="Táchira">Táchira</option>
            <option value="Trujillo">Trujillo</option>
            <option value="Vargas">Vargas</option>
            <option value="Yaracuy">Yaracuy</option>
            <option value="Zulia">Zulia</option>
            <option value="Dependencias Federales">Dependencias Federales</option>
          </select>
        </div>

        <div class="form-group">
          <label>✅ Asignar módulos (botones visibles en el panel)</label>
          <div class="modules-grid" id="modulesCheckboxes">
            <!-- Se generan dinámicamente -->
          </div>
        </div>

        <button type="submit" class="btn">✅ Crear Usuario</button>
      </form>
    </div>
  </div>

  <script>
    // Módulos disponibles (id → nombre visible)
    const MODULOS = {
      rh: "👥 Recursos Humanos",
      analisis: "🔍 Análisis",
      logistica: "📦 Logística",
      dppc: "⚖️ DPPC",
      asesoria: "⚖️ Asesoría Legal",
      disciplinarios: "📇 D.E. Disciplinarios",
      secretaria: "✒️ Secretaría",
      admin: "👑 Admin"
    };

    const SUPABASE_URL = 'https://stwriaubepeugobgyxjt.supabase.co';
    const supabase = window.supabase.createClient(SUPABASE_URL, 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN0d3JpYXViZXBldWdvYmd5eGp0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTQ3NDU0MDUsImV4cCI6MjA3MDMyMTQwNX0.3Rorn10j19M2nmmv03oSEwm-O-y0bsywAA8_CRR2O1g');
    const alertDiv = document.getElementById('alertMessage');
    const form = document.getElementById('createUserForm');
    const modulesContainer = document.getElementById('modulesCheckboxes');

    // Renderizar checkboxes de módulos
    function renderModulesCheckboxes() {
      modulesContainer.innerHTML = '';
      Object.entries(MODULOS).forEach(([id, label]) => {
        const div = document.createElement('div');
        div.className = 'module-item';
        div.innerHTML = `
          <input type="checkbox" id="mod_${id}" name="modulo" value="${id}">
          <label for="mod_${id}">${label}</label>
        `;
        modulesContainer.appendChild(div);
      });
    }

    // Inicializar
    renderModulesCheckboxes();

    async function getSession() {
      const { data: { session } } = await supabase.auth.getSession();
      return session;
    }

    async function checkAdmin() {
      const session = await getSession();
      if (!session) return false;
      const {  perfil } = await supabase
        .from('usuarios_perfil')
        .select('rol_id')
        .eq('user_id', session.user.id)
        .single();
      return perfil && perfil.rol_id === 1;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const isAdmin = await checkAdmin();
      if (!isAdmin) {
        showAlert('Acceso denegado. Solo administradores pueden crear usuarios.', 'error');
        return;
      }

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const rol_id = parseInt(document.getElementById('rol_id').value);
      const estadosSelect = Array.from(document.getElementById('estados').selectedOptions).map(o => o.value);
      const modulosCheckboxes = document.querySelectorAll('input[name="modulo"]:checked');
      const modulos_asignados = Array.from(modulosCheckboxes).map(cb => cb.value);

      if (!email || !password || !rol_id || !estadosSelect.length) {
        showAlert('Correo, contraseña, rol y al menos un estado son obligatorios.', 'error');
        return;
      }

      if (modulos_asignados.length === 0) {
        showAlert('⚠️ Debe asignar al menos un módulo/botón.', 'error');
        return;
      }

      try {
        const session = await getSession();
        const token = session.access_token;

        const res = await fetch(`${SUPABASE_URL}/functions/v1/create_user`, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ email, password, rol_id, estados_asignados: estadosSelect, modulos_asignados })
        });

        const result = await res.json();

        if (res.ok) {
          showAlert(`✅ Usuario creado con éxito.\nMódulos asignados: ${modulos_asignados.map(m => MODULOS[m]).join(', ')}`, 'success');
          form.reset();
          // Reset checkboxes
          document.querySelectorAll('input[name="modulo"]').forEach(cb => cb.checked = false);
        } else {
          throw new Error(result.error || 'Error desconocido');
        }
      } catch (err) {
        showAlert(`❌ Error: ${err.message}`, 'error');
        console.error(err);
      }
    });

    function showAlert(msg, type) {
      alertDiv.textContent = msg;
      alertDiv.className = `alert alert-${type}`;
      alertDiv.style.display = 'block';
      setTimeout(() => {
        if (type === 'success') alertDiv.style.display = 'none';
      }, 6000);
    }
  </script>
</body>
</html>
