<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin - ICAP Nacional</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #fafafa;
      font-family: 'Inter', sans-serif;
      color: #2d2d2d;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    .header {
      text-align: center;
      margin-bottom: 30px;
    }
    .logo {
      width: 80px;
      margin: 0 auto 16px;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      color: #2d2d2d;
      margin-bottom: 8px;
    }
    .subtitle {
      color: #555;
      font-size: 15px;
    }
    .btn-back {
      background: #722F37;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 10px 20px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      margin-bottom: 20px;
      transition: all 0.2s;
    }
    .btn-back:hover {
      background: #5e262d;
      transform: translateY(-1px);
    }
    .table-container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
      overflow: hidden;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th {
      background-color: #f5f5f5;
      padding: 16px 12px;
      text-align: left;
      font-weight: 600;
      color: #333;
      border-bottom: 2px solid #eee;
    }
    td {
      padding: 14px 12px;
      border-bottom: 1px solid #eee;
      font-size: 14px;
    }
    tr:last-child td {
      border-bottom: none;
    }
    .email { font-weight: 500; color: #222; }
    .rol { 
      display: inline-block;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
    }
    .rol-admin { background: #ffebee; color: #c62828; }
    .rol-user { background: #e8f5e9; color: #2e7d32; }
    .btn-delete {
      background: #f44336;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-delete:hover {
      background: #d32f2f;
      transform: scale(1.03);
    }
    .empty {
      text-align: center;
      padding: 40px;
      color: #777;
      font-style: italic;
    }
    .alert {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
      display: none;
    }
    .alert-success {
      background: #e8f5e9;
      color: #2e7d32;
      border: 1px solid #c8e6c9;
    }
    .alert-error {
      background: #ffebee;
      color: #c62828;
      border: 1px solid #ffcdd2;
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="index.html" class="btn-back">← Volver al Panel</a>
    <div class="header">
      <img 
        src="https://raw.githubusercontent.com/icapnacional/sistema-expedientes/main/Logo.png" 
        alt="ICAP Nacional - PNB" 
        class="logo"
      />
      <h1>Panel de Administración</h1>
      <p class="subtitle">Gestión de usuarios autorizados</p>
    </div>

    <div id="alertMessage" class="alert"></div>

    <div class="table-container">
      <table id="usersTable">
        <thead>
          <tr>
            <th>Usuario (Email)</th>
            <th>Rol</th>
            <th>Estados Asignados</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody id="usersBody">
          <tr><td colspan="4" class="empty">Cargando usuarios...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

<script>
  const SUPABASE_URL = 'https://stwriaubepeugobgyxjt.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN0d3JpYXViZXBldWdvYmd5eGp0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTQ3NDU0MDUsImV4cCI6MjA3MDMyMTQwNX0.3Rorn10j19M2nmmv03oSEwm-O-y0bsywAA8_CRR2O1g';
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const usersBody = document.getElementById('usersBody');
  const alertDiv = document.getElementById('alertMessage');

  function showAlert(msg, type = 'error') {
    alertDiv.textContent = msg;
    alertDiv.className = `alert alert-${type}`;
    alertDiv.style.display = 'block';
    setTimeout(() => alertDiv.style.display = 'none', 5000);
  }

  async function checkAdmin() {
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) {
      window.location.href = 'index.html';
      return false;
    }

    const { data: perfil, error } = await supabase
      .from('usuarios_perfil')
      .select('rol_id')
      .eq('user_id', session.user.id)
      .single();

    if (!perfil || perfil.rol_id !== 1) {
      showAlert('Acceso denegado: solo administradores.', 'error');
      setTimeout(() => window.location.href = 'index.html', 2000);
      return false;
    }
    return true;
  }

 async function loadUsers() {
  // 1️⃣ Obtener todos los perfiles
  const { data: perfiles, error: err1 } = await supabase
    .from('usuarios_perfil')
    .select('user_id, rol_id, estados_asignados, created_at')
    .order('created_at', { ascending: true });

  if (err1) {
    console.error('Error perfiles:', err1);
    usersBody.innerHTML = `<tr><td colspan="4" class="empty">❌ Error al cargar perfiles.</td></tr>`;
    return;
  }

  if (!perfiles || perfiles.length === 0) {
    usersBody.innerHTML = `<tr><td colspan="4" class="empty">✅ No hay usuarios registrados.</td></tr>`;
    return;
  }

  // 2️⃣ Obtener emails de auth.users (solo los IDs que necesitamos)
  const userIds = perfiles.map(p => p.user_id);
  const { data: authUsers, error: err2 } = await supabase
    .from('users')
    .select('id, email')
    .in('id', userIds);

  if (err2) {
    console.error('Error auth.users:', err2);
    usersBody.innerHTML = `<tr><td colspan="4" class="empty">❌ Error al cargar correos.</td></tr>`;
    return;
  }

  // Emparejar perfiles con emails
  const userMap = {};
  (authUsers || []).forEach(u => {
    userMap[u.id] = u.email;
  });

  // Render
  usersBody.innerHTML = perfiles.map(p => {
    const email = userMap[p.user_id] || '—';
    const rolTexto = p.rol_id === 1 ? 'Administrador' : 'Usuario';
    const rolClass = p.rol_id === 1 ? 'rol-admin' : 'rol-user';
    const estados = p.estados_asignados?.length ? p.estados_asignados.join(', ') : '—';
    const canDelete = p.rol_id !== 1;

    return `
      <tr>
        <td class="email">${email}</td>
        <td><span class="rol ${rolClass}">${rolTexto}</span></td>
        <td>${estados}</td>
        <td>
          ${canDelete ? `<button class="btn-delete" onclick="deleteUser('${p.user_id}')">🗑️ Eliminar</button>` : '<span>—</span>'}
        </td>
      </tr>
    `;
  }).join('');
}

  async function deleteUser(userId) {
    if (!confirm('⚠️ ¿Está seguro de eliminar este usuario? Esta acción no se puede deshacer.')) return;

    const { error } = await supabase
      .from('usuarios_perfil')
      .delete()
      .eq('user_id', userId);

    if (error) {
      showAlert('Error al eliminar: ' + (error.message || 'interno'), 'error');
      return;
    }

    showAlert('✅ Usuario eliminado correctamente.', 'success');
    loadUsers(); // recargar lista
  }

  // Iniciar
  (async () => {
    const isAdmin = await checkAdmin();
    if (isAdmin) {
      loadUsers();
    }
  })();
</script>
</body>
</html>
