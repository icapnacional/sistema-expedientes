<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RRHH | ICAP Nacional - PNB</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #fafafa;
      font-family: 'Inter', sans-serif;
      color: #2d2d2d;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
    }
    .header {
      text-align: center;
      margin-bottom: 24px;
      padding: 20px 0;
    }
    .header img {
      width: 80px;
      margin-bottom: 16px;
    }
    .header h1 {
      font-size: 22px;
      font-weight: 700;
      color: #2d2d2d;
      margin-bottom: 8px;
    }
    .user-info {
      text-align: center;
      background: white;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 20px;
      font-size: 14px;
      color: #555;
    }
    .tabs-header {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 20px;
    }
    .tab-btn {
      background: #f8f9fa;
      border: none;
      border-radius: 12px 12px 0 0;
      padding: 12px 20px;
      font-size: 14px;
      font-weight: 600;
      color: #555;
      cursor: pointer;
      transition: all 0.25s;
      flex: 1;
      min-width: 120px;
      text-align: center;
    }
    .tab-btn:hover {
      background: #f0f0f0;
      color: #722F37;
    }
    .tab-btn.active {
      background: #722F37;
      color: white;
    }
    .breadcrumb {
      text-align: center;
      margin-bottom: 16px;
      color: #777;
      font-size: 14px;
    }
    .actions-bar {
      text-align: center;
      margin-top: 20px;
    }
    .btn {
      background: #722F37; color: white;
      border: none; border-radius: 12px;
      padding: 12px 24px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:hover { background: #5e262d; }
  </style>
</head>
<body>
  <div class="container">
    <div class="breadcrumb">
      <a href="../index.html" style="color:#722F37;text-decoration:none">Inicio</a> › RRHH
    </div>
    <div class="header">
      <img src="https://raw.githubusercontent.com/icapnacional/sistema-expedientes/main/Logo.png" alt="ICAP">
      <h1>👥 Recursos Humanos</h1>
      <p style="font-size:15px;color:#722F37">Módulo Operativo</p>
    </div>
    <div class="user-info">
      <span id="userEmail">—</span> • <span id="userRol">—</span>
    </div>
    <div class="tabs-header" id="tabsNav">
      <button class="tab-btn" data-href="auditoria-nacional/index.html">📋 Auditoría</button>
      <button class="tab-btn" data-href="pie-de-fuerza/index.html">👥 Pie de Fuerza</button>
      <button class="tab-btn" data-href="rrhh-icap/index.html">🎯 RRHH ICAP</button>
      <button class="tab-btn" data-href="orden-servicio/index.html">📄 Orden</button>
      <button class="tab-btn" data-href="reposo/index.html">🛏️ Reposo</button>
      <button class="tab-btn" data-href="vacaciones/index.html">🌴 Vacaciones</button>
      <button class="tab-btn" data-href="cambio-servicios/index.html">🔄 Cambios</button>
      <button class="tab-btn" data-href="documentos/index.html">📁 Documentos</button>
    </div>
    <div class="actions-bar">
      <button class="btn" id="logoutBtn">Cerrar Sesión</button>
    </div>
  </div>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const SUPABASE_URL = 'https://xvqcgdbdwrocfcdfqpxv.supabase.co';
      const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh2cWNnZGJkd3JvY2ZjZGZxcHh2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjUwMjk4MjAsImV4cCI6MjA4MDYwNTgyMH0.Xjh4Dvq9A9lQKVPUv95i0MKikspYLPoNLm_6qFgYxmw';
      const client = supabase.createClient(SUPABASE_URL, ANON_KEY);
      const userEmailSpan = document.getElementById('userEmail');
      const userRolSpan = document.getElementById('userRol');
      const logoutBtn = document.getElementById('logoutBtn');

      try {
        const { data: { session } } = await client.auth.getSession();
        if (!session) return location.href = '../index.html';
        const { data: perfil } = await client
          .from('perfiles')
          .select('email, rol')
          .eq('id', session.user.id)
          .single();
        if (!perfil) return location.href = '../index.html';

        userEmailSpan.textContent = perfil.email;
        userRolSpan.textContent = perfil.rol === 'admin' ? 'Administrador' :
                                  perfil.rol === 'moderador' ? 'Moderador' : 'Consultor';

        // ✅ Redirección por pestaña → independencia total
        document.querySelectorAll('.tab-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            const href = btn.dataset.href;
            if (href) location.href = href;
          });
        });

        logoutBtn.onclick = async () => {
          await client.auth.signOut();
          location.href = '../index.html';
        };

      } catch (e) {
        console.error(e);
        location.href = '../index.html';
      }
    });
  </script>
</body>
</html>
