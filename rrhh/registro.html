<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Registro de Personal | RRHH</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #fafafa;
      font-family: 'Inter', sans-serif;
      color: #2d2d2d;
      padding: 20px;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
    }
    .header {
      text-align: center;
      margin-bottom: 24px;
    }
    .header img {
      width: 90px;
      margin-bottom: 16px;
    }
    .header h1 {
      font-size: 24px;
      font-weight: 700;
      color: #2d2d2d;
    }
    .user-info {
      background: white;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 24px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
      border: 1px solid #eee;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      margin-bottom: 24px;
      border: 1px solid #eee;
    }
    .card h2 {
      font-size: 20px;
      margin-bottom: 20px;
      color: #722F37;
    }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      font-weight: 600;
      color: #333;
    }
    input, select, textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
      background: #fdfdfd;
    }
    input[type="file"] {
      padding: 6px;
      background: white;
    }
    textarea {
      min-height: 60px;
      resize: vertical;
    }
    .btn {
      background-color: #722F37;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .btn:hover {
      background-color: #5e262d;
    }
    .btn-outline {
      background: transparent;
      border: 1px solid #722F37;
      color: #722F37;
    }
    .alert {
      padding: 12px;
      border-radius: 8px;
      margin: 16px 0;
      display: none;
    }
    .alert-success { background: #e8f5e9; color: #2e7d32; }
    .alert-error { background: #ffebee; color: #c62828; }
    .breadcrumb {
      background: #f8f9fa;
      border-radius: 12px;
      padding: 12px 20px;
      margin-bottom: 24px;
      font-size: 14px;
      color: #555;
    }
    .breadcrumb a { color: #722F37; text-decoration: none; font-weight: 600; }
    .breadcrumb span { margin: 0 8px; color: #888; }

    /* 📷 Cuadro de foto grande */
    #fotoContenedor {
      text-align: center;
      margin: 0 0 30px;
      padding: 20px;
      background: #f9f9f9;
      border-radius: 12px;
      border: 2px dashed #ccc;
    }
    #fotoContenedor h3 {
      margin-bottom: 16px;
      color: #722F37;
      font-weight: 600;
    }
    #fotoPreview {
      width: 220px;
      height: 220px;
      object-fit: cover;
      border-radius: 8px;
      border: 3px solid #722F37;
      background: #eee;
      display: none;
    }
    #subirFotoBtn {
      margin-top: 12px;
      cursor: pointer;
      background: #722F37;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      font-weight: 600;
    }
    #subirFotoBtn:hover {
      background: #5e262d;
    }
    #fotoInput {
      display: none;
    }

    /* Pantalla de acceso denegado */
    .access-denied {
      text-align: center;
      padding: 50px 20px;
      color: #c62828;
    }
    .access-denied h2 {
      font-weight: 600;
      margin: 16px 0 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="breadcrumb">
      <a href="../index.html">Inicio</a> <span>›</span>
      <a href="index.html">RRHH</a> <span>›</span>
      <a href="auditoria-nacional.html">Auditoría</a> <span>›</span>
      <strong>Registro</strong>
    </div>
    <div class="header">
      <img src="https://raw.githubusercontent.com/icapnacional/sistema-expedientes/main/Logo.png" alt="ICAP Nacional - PNB" />
      <h1>Inspectable para el Control de la Actuación Policial</h1>
    </div>
    <div class="user-info">
      <strong>Usuario:</strong> <span id="userEmail">—</span> |
      <strong>Rol:</strong> <span id="userRol">—</span>
    </div>

    <div class="card" id="formContainer">
      <h2>📝 Registro de Personal Auditado</h2>

      <!-- 🖼️ Foto centrada grande -->
      <div id="fotoContenedor">
        <h3>📸 Foto del Funcionario Uniformado</h3>
        <img id="fotoPreview" src="" alt="Foto del funcionario" />
        <br>
        <button type="button" id="subirFotoBtn">📁 Seleccionar foto</button>
        <input type="file" id="fotoInput" accept="image/jpeg,image/png,image/webp">
        <p style="margin-top:8px; font-size:13px; color:#666;">
          Formatos: JPG, PNG, WEBP | Máx. 5 MB
        </p>
      </div>

      <div id="alertMessage" class="alert"></div>
      <form id="registroForm">
        <div class="form-grid">
          <div class="form-group">
            <label for="cedula">Cédula *</label>
            <input type="text" id="cedula" required>
          </div>
          <div class="form-group">
            <label for="rango">Rango</label>
            <input type="text" id="rango">
          </div>
          <div class="form-group">
            <label for="apellidos_nombres">Apellidos y Nombres *</label>
            <input type="text" id="apellidos_nombres" required>
          </div>
          <div class="form-group">
            <label for="sexo">Sexo</label>
            <select id="sexo">
              <option value="">—</option>
              <option value="M">Masculino</option>
              <option value="F">Femenino</option>
            </select>
          </div>
          <div class="form-group">
            <label for="dependencia">Dependencia</label>
            <input type="text" id="dependencia">
          </div>
          <div class="form-group">
            <label for="region">Región</label>
            <input type="text" id="region">
          </div>
          <div class="form-group">
            <label for="estado">Estado</label>
            <input type="text" id="estado">
          </div>
          <div class="form-group">
            <label for="servicio">Servicio</label>
            <input type="text" id="servicio">
          </div>
          <div class="form-group">
            <label for="cohorte_promocion">Cohorte / Promoción</label>
            <input type="text" id="cohorte_promocion">
          </div>
          <div class="form-group">
            <label for="institucion_origen">Institución de Origen</label>
            <input type="text" id="institucion_origen">
          </div>
          <div class="form-group">
            <label for="fecha_ingreso">Fecha de Ingreso</label>
            <input type="date" id="fecha_ingreso">
          </div>
          <div class="form-group">
            <label for="telefono">Teléfono</label>
            <input type="text" id="telefono">
          </div>
          <div class="form-group">
            <label for="status">Status</label>
            <select id="status">
              <option value="A">Activo</option>
              <option value="S">Suspendido</option>
              <option value="E">Egresado</option>
            </select>
          </div>
          <div class="form-group">
            <label for="fecha_nacimiento">Fecha de Nacimiento</label>
            <input type="date" id="fecha_nacimiento">
          </div>
          <div class="form-group">
            <label for="edad_funcionario">Edad / Observación</label>
            <input type="text" id="edad_funcionario">
          </div>
          <div class="form-group">
            <label for="fecha_oficio">Fecha de Oficio</label>
            <input type="text" id="fecha_oficio" placeholder="Ej: 2024-03-25">
          </div>
          <div class="form-group">
            <label for="fecha_transferencia_normalizacion">Fecha Transferencia/Normalización</label>
            <input type="text" id="fecha_transferencia_normalizacion" placeholder="Ej: 2024-03-25">
          </div>
          <div class="form-group">
            <label for="tipo_movimiento">Tipo de Movimiento</label>
            <input type="text" id="tipo_movimiento">
          </div>
          <div class="form-group" style="grid-column:1/-1;">
            <label for="observaciones">Observaciones</label>
            <textarea id="observaciones"></textarea>
          </div>
          <div class="form-group">
            <label for="fechas_egreso">Fechas de Egreso</label>
            <input type="text" id="fechas_egreso">
          </div>
          <div class="form-group">
            <label for="direccion">Dirección</label>
            <input type="text" id="direccion">
          </div>
          <div class="form-group">
            <label for="correo_electronico">Correo Electrónico</label>
            <input type="email" id="correo_electronico">
          </div>
        </div>
        <div style="text-align:right; margin-top:20px;">
          <button type="button" class="btn btn-outline" onclick="history.back()">← Cancelar</button>
          <button type="submit" class="btn">✅ Registrar</button>
        </div>
      </form>
    </div>
  </div>
  <script>
    const SUPABASE_URL = 'https://xvqcgdbdwrocfcdfqpxv.supabase.co';
    const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh2cWNnZGJkd3JvY2ZjZGZxcHh2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjUwMjk4MjAsImV4cCI6MjA4MDYwNTgyMH0.Xjh4Dvq9A9lQKVPUv95i0MKikspYLPoNLm_6qFgYxmw';
    const client = supabase.createClient(SUPABASE_URL, ANON_KEY);
    const alertDiv = document.getElementById('alertMessage');
    const formContainer = document.getElementById('formContainer');

    // 📤 Trigger para el botón de subir foto
    document.getElementById('subirFotoBtn').addEventListener('click', () => {
      document.getElementById('fotoInput').click();
    });

    // 🖼️ Preview de foto
    document.getElementById('fotoInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      const preview = document.getElementById('fotoPreview');
      if (file) {
        const reader = new FileReader();
        reader.onload = () => {
          preview.src = reader.result;
          preview.style.display = 'block';
        };
        reader.readAsDataURL(file);
      } else {
        preview.style.display = 'none';
      }
    });

    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const { data: { session }, error: sessionError } = await client.auth.getSession();
        if (sessionError || !session) {
          return window.location.href = '../index.html';
        }

        const { data: perfil } = await client
          .from('perfiles')
          .select('email, rol')
          .eq('id', session.user.id)
          .single();

        if (!perfil) return window.location.href = '../index.html';

        // 🔒 Bloqueo total para consultores
        if (perfil.rol === 'consultor') {
          formContainer.innerHTML = `
            <div class="access-denied">
              <div style="font-size:48px;">🔒</div>
              <h2>Acceso Restringido</h2>
              <p style="font-size:16px; max-width:600px; margin:0 auto;">
                Solo <strong>Administradores</strong> y <strong>Moderadores</strong> pueden registrar nuevo personal.
              </p>
              <br>
              <button onclick="window.location.href='auditoria-nacional.html'"
                      class="btn">
                ← Volver a Auditoría Nacional
              </button>
            </div>
          `;
          document.getElementById('userEmail').textContent = perfil.email;
          document.getElementById('userRol').textContent = 'Consultor';
          return;
        }

        // ✅ Rol permitido
        document.getElementById('userEmail').textContent = perfil.email;
        document.getElementById('userRol').textContent = 
          perfil.rol === 'admin' ? 'Administrador' : 'Moderador';

      } catch (err) {
        console.error('Error:', err);
        window.location.href = '../index.html';
      }
    });

    document.getElementById('registroForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      showAlert('', '');

      const cedula = document.getElementById('cedula').value.trim();
      const apellidosNombres = document.getElementById('apellidos_nombres').value.trim();
      const fileInput = document.getElementById('fotoInput');
      const file = fileInput.files[0];

      if (!cedula || !apellidosNombres) {
        return showAlert('⚠️ Cédula y Apellidos/Nombres son obligatorios.', 'error');
      }

      let fotoUrl = null;

      try {
        // 🔍 Verificar cédula única
        const { data: existing } = await client
          .from('auditoria_personal')
          .select('cedula')
          .eq('cedula', cedula)
          .single()
          .throwOnError(false); // no lanza error si no encuentra

        if (existing) {
          return showAlert(`❌ La cédula <strong>${cedula}</strong> ya está registrada.`, 'error');
        }

        // ✅ Subir foto (si hay)
        if (file) {
          if (!['image/jpeg', 'image/png', 'image/webp'].includes(file.type)) {
            return showAlert('⚠️ Solo se permiten imágenes JPG, PNG o WEBP.', 'error');
          }
          if (file.size > 5 * 1024 * 1024) {
            return showAlert('⚠️ La imagen no debe superar los 5 MB.', 'error');
          }

          const fileName = `foto_${cedula}_${Date.now()}.${file.name.split('.').pop()}`;
          const { error: uploadError } = await client.storage
            .from('fotos_funcionarios')
            .upload(`uniformados/${fileName}`, file, {
              upsert: false,
              contentType: file.type
            });

          if (uploadError) throw uploadError;

          const { data: { publicUrl } } = client.storage
            .from('fotos_funcionarios')
            .getPublicUrl(`uniformados/${fileName}`);

          fotoUrl = publicUrl;
        }

        // ✅ Insertar datos
        const data = {
          cedula,
          rango: document.getElementById('rango').value,
          apellidos_nombres: apellidosNombres,
          sexo: document.getElementById('sexo').value,
          dependencia: document.getElementById('dependencia').value,
          region: document.getElementById('region').value,
          estado: document.getElementById('estado').value,
          servicio: document.getElementById('servicio').value,
          cohorte_promocion: document.getElementById('cohorte_promocion').value,
          institucion_origen: document.getElementById('institucion_origen').value,
          fecha_ingreso: document.getElementById('fecha_ingreso').value || null,
          telefono: document.getElementById('telefono').value,
          status: document.getElementById('status').value,
          fecha_nacimiento: document.getElementById('fecha_nacimiento').value || null,
          edad_funcionario: document.getElementById('edad_funcionario').value,
          fecha_oficio: document.getElementById('fecha_oficio').value,
          fecha_transferencia_normalizacion: document.getElementById('fecha_transferencia_normalizacion').value,
          tipo_movimiento: document.getElementById('tipo_movimiento').value,
          observaciones: document.getElementById('observaciones').value,
          fechas_egreso: document.getElementById('fechas_egreso').value,
          direccion: document.getElementById('direccion').value,
          correo_electronico: document.getElementById('correo_electronico').value,
          foto_uniformado_url: fotoUrl // 👈 nueva columna
        };

        const { error: insertError } = await client
          .from('auditoria_personal')
          .insert(data);

        if (insertError) {
          if (insertError.code === '23505') {
            return showAlert(`❌ Violación de restricción única: cédula ${cedula} duplicada.`, 'error');
          }
          throw insertError;
        }

        showAlert('✅ Registro exitoso. El personal ha sido agregado.', 'success');
        document.getElementById('registroForm').reset();
        document.getElementById('fotoPreview').style.display = 'none';
        setTimeout(() => window.location.href = 'auditoria-nacional.html', 2000);

      } catch (err) {
        console.error('Error:', err);
        showAlert(`❌ Error: ${err.message || 'No se pudo completar el registro'}`, 'error');
      }
    });

    function showAlert(msg, type) {
      alertDiv.innerHTML = msg;
      alertDiv.className = 'alert ' + (type === 'success' ? 'alert-success' : 'alert-error');
      alertDiv.style.display = msg ? 'block' : 'none';
    }
  </script>
</body>
</html>
