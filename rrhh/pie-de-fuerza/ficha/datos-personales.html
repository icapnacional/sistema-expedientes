<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <title>Datos Personales</title>
  <style>
    .form-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(240px,1fr)); gap:20px; }
    .form-group { margin-bottom:16px; }
    label { display:block; font-weight:600; margin-bottom:6px; color:#444; }
    input, select, textarea { width:100%; padding:12px; border:1px solid #ddd; border-radius:8px; font-size:15px; }
    .btn { background:#722F37; color:white; border:none; border-radius:12px; padding:14px 28px; font-size:16px; cursor:pointer; }
    .btn:hover { background:#5e262d; }
  </style>
</head>
<body>
  <div class="form-grid">
    <div class="form-group">
      <label>Nombre Completo *</label>
      <input type="text" id="nombre_completo">
    </div>
    <div class="form-group">
      <label>Cédula * (8 dígitos)</label>
      <input type="text" id="cedula" maxlength="8" readonly>
    </div>
    <!-- ... otros campos ... -->
  </div>
  <div style="text-align:right; margin-top:24px;">
    <button class="btn" onclick="guardar()">💾 Guardar Datos Personales</button>
  </div>
  <script>
    // ✅ Cargar cédula desde URL
    const urlParams = new URLSearchParams(window.location.search);
    const cedula = urlParams.get('cedula');
    if (cedula) {
      document.getElementById('cedula').value = cedula;
      // Aquí iría la lógica de cargar datos desde Supabase
      console.log('Cargando datos para cédula:', cedula);
    }

    function guardar() {
      alert(`✅ Datos personales guardados para C.I. ${cedula}`);
    }
  </script>
</body>
</html>
