<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>📋 Ficha Integral | Pie de Fuerza</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter',sans-serif; }
    body { background:#fafafa; padding:20px; }
    .container { max-width:1000px; margin:0 auto; }
    .breadcrumb { background:#f8f9fa; border-radius:12px; padding:12px 20px; margin-bottom:24px; font-size:14px; }
    .breadcrumb a { color:#722F37; font-weight:600; text-decoration:none; }
    .breadcrumb span { margin:0 8px; color:#888; }
    .header { text-align:center; margin-bottom:24px; }
    .header h1 { font-size:24px; color:#722F37; }
    .tabs-container {
      background:white; border-radius:16px; box-shadow:0 6px 20px rgba(0,0,0,0.08);
      padding:24px; margin-bottom:24px; border:1px solid #eee;
    }
    .tabs-header {
      display:flex; flex-wrap:wrap; gap:6px; margin-bottom:24px;
      border-bottom:2px solid #f0f0f0; overflow-x:auto;
    }
    .tab-btn {
      background:#f8f9fa; border:none; border-radius:10px 10px 0 0;
      padding:10px 16px; font-size:13px; font-weight:600; color:#555;
      cursor:pointer; white-space:nowrap;
    }
    .tab-btn:hover { background:#f0f0f0; color:#722F37; }
    .tab-btn.active { background:#722F37; color:white; }
    #tabContent { min-height:400px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="breadcrumb">
      <a href="../../index.html">Inicio</a> <span>›</span>
      <a href="../index.html">Pie de Fuerza</a> <span>›</span>
      <strong>Ficha Integral</strong>
    </div>
    <div class="header">
      <h1>📋 Ficha Integral del Funcionario</h1>
      <div id="nombreFuncionario" style="font-size:18px; color:#2d2d2d; margin-top:8px;"></div>
    </div>
    <div class="tabs-container">
      <div class="tabs-header">
        <button class="tab-btn active" data-file="datos-personales.html">👤 Datos Personales</button>
        <button class="tab-btn" data-file="contactos.html">📞 Contactos</button>
        <button class="tab-btn" data-file="patria.html">🇵🇾 Patria</button>
        <button class="tab-btn" data-file="bancarios.html">🏦 Bancarios</button>
        <button class="tab-btn" data-file="descriptivos.html">📏 Descriptivos</button>
        <button class="tab-btn" data-file="formacion.html">🎓 Formación</button>
        <button class="tab-btn" data-file="electorales.html">🗳️ Electorales</button>
        <button class="tab-btn" data-file="documentos.html">📄 Documentos</button>
        <button class="tab-btn" data-file="antecedentes.html">🏛️ Antecedentes</button>
        <button class="tab-btn" data-file="academicos.html">🎓 Académicos</button>
        <button class="tab-btn" data-file="hijos.html">👨‍👩‍👧 Hijos</button>
        <button class="tab-btn" data-file="asegurados.html">🧑‍🤝‍🧑 Asegurados</button>
        <button class="tab-btn" data-file="laborales.html">👔 Laborales</button>
      </div>
      <div id="tabContent"></div>
    </div>
  </div>
  <script>
    // ✅ Cargar cédula desde URL
    const urlParams = new URLSearchParams(window.location.search);
    const cedula = urlParams.get('cedula');
    
    // ✅ Cargar primera pestaña
    document.addEventListener('DOMContentLoaded', () => {
      if (cedula) {
        document.getElementById('nombreFuncionario').textContent = `C.I. ${cedula}`;
        loadTab('datos-personales.html');
      }
    });

    // ✅ Cargar pestaña dinámicamente
    function loadTab(filename) {
      const url = `${filename}?cedula=${cedula}`;
      fetch(url)
        .then(response => response.text())
        .then(html => {
          document.getElementById('tabContent').innerHTML = html;
          // Ejecutar scripts inline si los hay
          const scripts = document.getElementById('tabContent').querySelectorAll('script');
          scripts.forEach(script => {
            const newScript = document.createElement('script');
            if (script.src) {
              newScript.src = script.src;
            } else {
              newScript.textContent = script.textContent;
            }
            document.head.appendChild(newScript);
            script.remove();
          });
        })
        .catch(err => {
          document.getElementById('tabContent').innerHTML = `<p style="padding:40px; text-align:center; color:#c62828;">❌ Error al cargar ${filename}</p>`;
        });
    }

    // ✅ Eventos de tabs
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        loadTab(btn.dataset.file);
      });
    });
  </script>
</body>
</html>
