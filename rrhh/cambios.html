<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cambiar Personal - ICAP</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background-color: #f5f5f5;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    h2 {
      color: #722F37;
      text-align: center;
    }
    input[type="text"] {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }
    button {
      padding: 10px 16px;
      margin: 5px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    #volverBtn {
      background-color: #1976D2; /* Azul como el botón 'buscar' */
      color: white;
      float: left;
    }
    #buscarBtn {
      background-color: #1976D2;
      color: white;
    }
    #asignarIcapBtn {
      background-color: #2E7D32; /* Verde oscuro */
      color: white;
    }
    #resultado {
      margin-top: 20px;
      padding: 15px;
      background: #f9f9f9;
      border-left: 4px solid #1976D2;
      display: none;
    }
    .error { color: red; }
    .success { color: green; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Cambiar Personal a ICAP</h2>

    <button id="volverBtn">Volver</button>

    <div style="clear: both; margin-top: 20px;">
      <label for="cedula"><strong>Cédula del funcionario:</strong></label>
      <input type="text" id="cedula" placeholder="Ingrese número de cédula" />
      <button id="buscarBtn">Buscar</button>
    </div>

    <div id="resultado"></div>
  </div>

  <script>
    // 🔑 Configuración de Supabase
    const supabaseUrl = 'https://TU_PROJECT_REF.supabase.co';
    const supabaseAnonKey = 'TU_ANON_KEY'; // ⚠️ Si usas RLS, asegúrate de que el usuario esté autenticado o usa un servicio seguro
    const supabase = supabase.createClient(supabaseUrl, supabaseAnonKey);

    // Botón "Volver"
    document.getElementById('volverBtn').addEventListener('click', () => {
      window.location.href = '../index.html';
    });

    // Botón "Buscar"
    document.getElementById('buscarBtn').addEventListener('click', async () => {
      const cedula = document.getElementById('cedula').value.trim();
      const resultadoDiv = document.getElementById('resultado');

      if (!cedula) {
        resultadoDiv.innerHTML = '<p class="error">Por favor ingrese una cédula.</p>';
        resultadoDiv.style.display = 'block';
        return;
      }

      try {
        const { data, error } = await supabase
          .from('auditoria_personal')
          .select('*')
          .eq('cedula', cedula)
          .single(); // Solo un registro esperado

        resultadoDiv.style.display = 'block';

        if (error || !data) {
          resultadoDiv.innerHTML = `<p class="error">Cédula no encontrada en la base de datos.</p>`;
          return;
        }

        // Mostrar datos
        const p = data;
        resultadoDiv.innerHTML = `
          <h3>Datos del personal:</h3>
          <p><strong>Cédula:</strong> ${p.cedula}</p>
          <p><strong>Nombre:</strong> ${p.apellidos_nombres || '—'}</p>
          <p><strong>Rango:</strong> ${p.rango || '—'}</p>
          <p><strong>Estado:</strong> ${p.estado || '—'}</p>
          <p><strong>Servicio actual:</strong> ${p.servicio || '—'}</p>
          <button id="asignarIcapBtn">Asignar a ICAP</button>
        `;

        // Asignar a ICAP
        document.getElementById('asignarIcapBtn').addEventListener('click', async () => {
          const { error: updateError } = await supabase
            .from('auditoria_personal')
            .update({ servicio: 'icap' })
            .eq('cedula', cedula);

          if (updateError) {
            resultadoDiv.innerHTML += `<p class="error">Error al asignar: ${updateError.message}</p>`;
          } else {
            resultadoDiv.innerHTML += `<p class="success">✅ ¡Personal asignado a ICAP exitosamente!</p>`;
            // Opcional: deshabilitar el botón
            document.getElementById('asignarIcapBtn').disabled = true;
          }
        });

      } catch (err) {
        console.error(err);
        resultadoDiv.innerHTML = `<p class="error">Error inesperado: ${err.message}</p>`;
        resultadoDiv.style.display = 'block';
      }
    });
  </script>
</body>
</html>
