<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Consulta de Personal - ICAP</title>
  <link rel="stylesheet" href="../css/estilos.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    .result-card { margin-top: 20px; padding: 15px; border: 1px solid #ddd; border-radius: 8px; }
    .field { display: flex; justify-content: space-between; margin: 4px 0; font-size: 14px; }
    .label { font-weight: bold; color: #333; }
    .value { color: #555; }
    .btn { padding: 8px 16px; margin: 5px; cursor: pointer; border: none; border-radius: 4px; }
    .btn-primary { background: #1976d2; color: white; }
    .btn-secondary { background: #757575; color: white; }
    .search-container { margin: 20px 0; }
    #resultsList { margin-top: 20px; }
    .pagination { margin-top: 15px; text-align: center; }
    .pagination button { margin: 0 5px; padding: 6px 12px; }
    #searchMessage { margin-top: 10px; font-weight: bold; }
  </style>
</head>
<body>
  <div class="header">
    <h2>Inspectable para el Control de la Actuación Policial</h2>
    <p><strong>Usuario:</strong> <span id="userEmail">Cargando...</span> | <strong>Rol:</strong> <span id="userRol">Cargando...</span></p>
    <button onclick="window.location.href='../index.html'" class="btn btn-secondary">Volver</button>
  </div>

  <div class="search-container">
    <input type="text" id="searchQuery" placeholder="Buscar por cédula o nombre..." />
    <button id="btnBuscar" class="btn btn-primary">Buscar</button>
    <div id="searchMessage"></div>
  </div>

  <div id="resultsList" style="display:none;">
    <h3>Resultados</h3>
    <div id="resultsTable"></div>
    <div class="pagination" id="pagination"></div>
  </div>

  <div id="resultCard" class="result-card" style="display:none;">
    <h3>Ficha de Personal</h3>
    <div id="fichaContenido"></div>
    <button id="btnExportPDF" class="btn btn-primary">Exportar PDF</button>
    <button id="btnCerrarFicha" class="btn btn-secondary">Cerrar</button>
  </div>

  <script>
    // ✅ Configuración de Supabase
    const SUPABASE_URL = 'https://xvqcgdbdwrocfcdfqpxv.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh2cWNnZGJkd3JvY2ZjZGZxcHh2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjUwMjk4MjAsImV4cCI6MjA4MDYwNTgyMH0.Xjh4Dvq9A9lQKVPUv95i0MKikspYLPoNLm_6qFgYxmw';
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const { jsPDF } = window.jspdf;
    let currentPage = 1;
    const RESULTS_PER_PAGE = 15;

    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const {  { session }, error: sessionError } = await client.auth.getSession();

        if (sessionError || !session) {
          return window.location.href = '../index.html';
        }

        // ✅ CORRECCIÓN CLAVE: Asegurar que el cliente use el token autenticado
        await client.auth.setSession(session);

        const {  perfil, error: perfilError } = await client
          .from('perfiles')
          .select('email, rol, modulos_asignados')
          .eq('id', session.user.id)
          .single();

        if (perfilError || !perfil) {
          alert('⚠️ Perfil no encontrado. Redirigiendo...');
          return window.location.href = '../index.html';
        }

        const userRol = perfil.rol || 'consultor';
        if (userRol !== 'admin' && !perfil.modulos_asignados?.includes('rh')) {
          alert('🔒 Acceso denegado: no tienes permiso para Recursos Humanos.');
          return window.location.href = '../index.html';
        }

        document.getElementById('userEmail').textContent = perfil.email;
        document.getElementById('userRol').textContent =
          userRol === 'admin' ? 'Administrador' :
          userRol === 'moderador' ? 'Moderador' : 'Consultor';

        // Eventos
        document.getElementById('btnBuscar').addEventListener('click', iniciarBusqueda);
        document.getElementById('searchQuery').addEventListener('keypress', e => e.key === 'Enter' && iniciarBusqueda());
        document.getElementById('btnCerrarFicha').addEventListener('click', cerrarFicha);
        document.getElementById('btnExportPDF').addEventListener('click', exportarPDF);

      } catch (err) {
        console.error('Error en autenticación:', err);
        window.location.href = '../index.html';
      }
    });

    async function iniciarBusqueda() {
      const rawQuery = document.getElementById('searchQuery').value.trim();
      const msg = document.getElementById('searchMessage');
      msg.textContent = '';

      if (!rawQuery) {
        msg.textContent = '⚠️ Ingresa un término de búsqueda.';
        msg.style.color = '#ff9800';
        return;
      }

      // Normalizar cédula: solo dígitos
      const cleanCedula = rawQuery.replace(/[^0-9]/g, '');

      // Si parece una cédula válida (7-9 dígitos)
      if (/^\d{7,9}$/.test(cleanCedula)) {
        msg.textContent = '🔍 Buscando por cédula...';
        msg.style.color = '#1976d2';

        try {
          const { data, error } = await client
            .from('auditoria_personal')
            .select('*')
            .eq('cedula', cleanCedula)
            .single();

          if (error || !data) {
            msg.textContent = `❌ Cédula ${cleanCedula} no encontrada.`;
            msg.style.color = '#c62828';
            limpiarResultados();
            return;
          }

          mostrarFichaCompleta(data);
          msg.textContent = '';
          return;
        } catch (err) {
          console.error('Error en búsqueda por cédula:', err);
          msg.textContent = '❌ Error al buscar cédula.';
          msg.style.color = '#c62828';
          return;
        }
      }

      // Si no es cédula, buscar por nombre
      currentPage = 1;
      await buscarPorNombre(rawQuery);
    }

    async function buscarPorNombre(searchTerm) {
      const msg = document.getElementById('searchMessage');
      msg.textContent = '🔍 Buscando por nombre...';
      msg.style.color = '#1976d2';

      try {
        const { data, error, count } = await client
          .from('auditoria_personal')
          .select('*', { count: 'exact' })
          .or(`apellidos_nombres.ilike.%${searchTerm}%`)
          .range((currentPage - 1) * RESULTS_PER_PAGE, currentPage * RESULTS_PER_PAGE - 1)
          .order('apellidos_nombres', { ascending: true });

        if (error) throw error;

        if (!data || data.length === 0) {
          msg.textContent = '❌ No se encontraron coincidencias.';
          msg.style.color = '#c62828';
          limpiarResultados();
          return;
        }

        mostrarResultados(data, count);
        msg.textContent = '';
      } catch (err) {
        console.error('Error en búsqueda por nombre:', err);
        document.getElementById('searchMessage').textContent = '❌ Error al buscar.';
        document.getElementById('searchMessage').style.color = '#c62828';
        limpiarResultados();
      }
    }

    function mostrarResultados(data, total) {
      const container = document.getElementById('resultsTable');
      const paginationEl = document.getElementById('pagination');
      container.innerHTML = '';

      const table = document.createElement('table');
      table.style.width = '100%';
      table.style.borderCollapse = 'collapse';
      table.innerHTML = `
        <thead>
          <tr style="background:#f5f5f5;">
            <th style="border:1px solid #ddd; padding:8px;">Cédula</th>
            <th style="border:1px solid #ddd; padding:8px;">Nombre</th>
            <th style="border:1px solid #ddd; padding:8px;">Acción</th>
          </tr>
        </thead>
        <tbody id="resultsBody"></tbody>
      `;
      container.appendChild(table);

      const tbody = document.getElementById('resultsBody');
      data.forEach(row => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td style="border:1px solid #ddd; padding:8px;">${row.cedula || ''}</td>
          <td style="border:1px solid #ddd; padding:8px;">${row.apellidos_nombres || ''}</td>
          <td style="border:1px solid #ddd; padding:8px;">
            <button class="btn btn-primary" onclick="verFichaCompleta('${row.cedula}')">Ver</button>
          </td>
        `;
        tbody.appendChild(tr);
      });

      // Paginación
      const totalPages = Math.ceil(total / RESULTS_PER_PAGE);
      let paginationHTML = '';
      if (currentPage > 1) {
        paginationHTML += `<button onclick="cambiarPagina(${currentPage - 1})">← Anterior</button>`;
      }
      paginationHTML += `<span>Página ${currentPage} de ${totalPages}</span>`;
      if (currentPage < totalPages) {
        paginationHTML += `<button onclick="cambiarPagina(${currentPage + 1})">Siguiente →</button>`;
      }
      paginationEl.innerHTML = paginationHTML;

      document.getElementById('resultCard').style.display = 'none';
      document.getElementById('resultsList').style.display = 'block';
    }

    async function verFichaCompleta(cedula) {
      const { data, error } = await client
        .from('auditoria_personal')
        .select('*')
        .eq('cedula', cedula)
        .single();

      if (!error && data) {
        mostrarFichaCompleta(data);
      }
    }

    function mostrarFichaCompleta(data) {
      const contenido = document.getElementById('fichaContenido');
      contenido.innerHTML = '';

      const campos = [
        { label: 'Cédula', value: data.cedula },
        { label: 'Nombre y Apellidos', value: data.apellidos_nombres },
        { label: 'Rango', value: data.rango },
        { label: 'Sexo', value: data.sexo },
        { label: 'Región', value: data.region },
        { label: 'Estado', value: data.estado },
        { label: 'Dirección', value: data.direccion },
        { label: 'Cargo', value: data.cargo },
        { label: 'Estatus', value: data.estatus },
        { label: 'Edad', value: data.edad },
        { label: 'Fecha de Nacimiento', value: data.fecha_nacimiento },
        { label: 'Teléfono del Funcionario', value: data.telefono_funcionario },
        { label: 'Teléfono de Emergencia', value: data.telefono_emergencia },
        { label: 'Correo Electrónico', value: data.correo_electronico },
        { label: 'Nivel Académico', value: data.nivel_academico },
        { label: 'Fecha de Ingreso al CPNB', value: data.fecha_ingreso_cpn },
        { label: 'Fecha del Último Ascenso', value: data.fecha_ultimo_ascenso },
        { label: 'Antigüedad en la Función Policial', value: data.antiguedad },
        { label: 'Servicio', value: data.servicio },
        { label: 'Dirección de Habitación', value: data.direccion_habitacion },
        { label: 'Último Cargo', value: data.ultimo_cargo }
      ];

      campos.forEach(campo => {
        if (campo.value) {
          const div = document.createElement('div');
          div.className = 'field';
          div.innerHTML = `<span class="label">${campo.label}:</span> <span class="value">${campo.value}</span>`;
          contenido.appendChild(div);
        }
      });

      document.getElementById('resultsList').style.display = 'none';
      document.getElementById('resultCard').style.display = 'block';
    }

    function cerrarFicha() {
      document.getElementById('resultCard').style.display = 'none';
      document.getElementById('searchQuery').value = '';
      document.getElementById('searchMessage').textContent = '';
    }

    function limpiarResultados() {
      document.getElementById('resultsList').style.display = 'none';
      document.getElementById('resultCard').style.display = 'none';
    }

    async function cambiarPagina(page) {
      currentPage = page;
      const searchTerm = document.getElementById('searchQuery').value.trim();
      if (searchTerm) {
        await buscarPorNombre(searchTerm);
      }
    }

    function exportarPDF() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF('p', 'mm', 'a4');
      doc.setFontSize(16);
      doc.text('Ficha de Personal - ICAP', 105, 15, null, null, 'center');
      doc.setFontSize(12);

      const fields = document.querySelectorAll('.field');
      let y = 30;
      fields.forEach(field => {
        const label = field.querySelector('.label').textContent;
        const value = field.querySelector('.value').textContent;
        doc.text(`${label} ${value}`, 20, y);
        y += 7;
        if (y > 280) {
          doc.addPage();
          y = 20;
        }
      });

      doc.save(`ficha_${new Date().getTime()}.pdf`);
    }
  </script>
</body>
</html>
