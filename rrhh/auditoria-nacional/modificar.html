<script>
function showAlert(msg, type) {
  const alertDiv = document.getElementById('alertMessage');
  alertDiv.textContent = msg;
  alertDiv.className = 'alert ' + (type === 'success' ? 'alert-success' : 'alert-error');
  alertDiv.style.display = msg ? 'block' : 'none';
}

const SUPABASE_URL = 'https://xvqcgdbdwrocfcdfqpxv.supabase.co';
const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh2cWNnZGJkd3JvY2ZjZGZxcHh2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjUwMjk4MjAsImV4cCI6MjA4MDYwNTgyMH0.Xjh4Dvq9A9lQKVPUv95i0MKikspYLPoNLm_6qFgYxmw';
const client = supabase.createClient(SUPABASE_URL, ANON_KEY);
let currentCedula = '';

document.addEventListener('DOMContentLoaded', async () => {
  try {
    const { data: { session }, error } = await client.auth.getSession();
    if (error || !session) return window.location.href = '../index.html';

    const { data: perfil, error: pErr } = await client
      .from('perfiles')
      .select('email, rol')
      .eq('id', session.user.id)
      .single();

    if (pErr || !perfil || (perfil.rol !== 'admin' && perfil.rol !== 'moderador')) {
      alert('🔒 Acceso restringido.');
      return window.location.href = '../index.html';
    }

    document.getElementById('userEmail').textContent = perfil.email;
    document.getElementById('userRol').textContent =
      perfil.rol === 'admin' ? 'Administrador' : 'Moderador';

    document.getElementById('btnBuscar').addEventListener('click', buscarFuncionario);
    document.getElementById('cedula_buscar').addEventListener('keypress', e => {
      if (e.key === 'Enter') buscarFuncionario();
    });
    document.getElementById('modificarForm').addEventListener('submit', guardarCambios);

    // Auto-calcular edad
    document.getElementById('fecha_nacimiento').addEventListener('change', calcularEdad);
  } catch (err) {
    console.error(err);
    window.location.href = '../index.html';
  }
});

function calcularEdad() {
  const fechaNac = document.getElementById('fecha_nacimiento').value;
  const edadInput = document.getElementById('edad_funcionario');
  if (fechaNac) {
    const hoy = new Date();
    const nac = new Date(fechaNac);
    let edad = hoy.getFullYear() - nac.getFullYear();
    const mesDiff = hoy.getMonth() - nac.getMonth();
    if (mesDiff < 0 || (mesDiff === 0 && hoy.getDate() < nac.getDate())) {
      edad--;
    }
    edadInput.value = edad >= 0 ? edad : '';
  } else {
    edadInput.value = '';
  }
}

async function buscarFuncionario() {
  const cedula = document.getElementById('cedula_buscar').value.trim();
  if (!/^\d{8}$/.test(cedula)) {
    showAlert('⚠️ Cédula debe tener 8 dígitos.', 'error');
    return;
  }

  try {
    const { data, error } = await client
      .from('auditoria_personal')
      .select('*')
      .eq('cedula', cedula)
      .single();

    if (error || !data) throw new Error('No encontrado');

    cargarDatosFormulario(data);
    document.getElementById('datosFuncionario').style.display = 'block';
    document.getElementById('modificarForm').style.display = 'block';
    showAlert('✅ Datos cargados.', 'success');

  } catch (err) {
    showAlert('❌ Cédula no encontrada en Auditoría Personal.', 'error');
    document.getElementById('datosFuncionario').style.display = 'none';
    document.getElementById('modificarForm').style.display = 'none';
  }
}

function cargarFotoActual(cedula) {
  const photoContainer = document.getElementById('photoContainer');
  photoContainer.innerHTML = '🪪';
  const extensions = ['jpeg', 'jpg', 'png'];
  let fotoCargada = false;
  for (const ext of extensions) {
    const path = `foto_${cedula}.${ext}`;
    client.storage
      .from('fotos_funcionarios')
      .createSignedUrl(path, 3600)
      .then(({ data, error }) => {
        if (!error && data?.signedUrl && !fotoCargada) {
          const img = document.createElement('img');
          img.src = data.signedUrl;
          img.style.width = '100%';
          img.style.height = '100%';
          img.style.objectFit = 'cover';
          photoContainer.innerHTML = '';
          photoContainer.appendChild(img);
          fotoCargada = true;
        }
      })
      .catch(() => {});
  }
}

// ✅ FUNCIÓN CORREGIDA: carga segura de rango, region, estado, status
function cargarDatosFormulario(f) {
  currentCedula = f.cedula;
  document.getElementById('headerCedula').textContent = f.cedula;
  document.getElementById('cedula').value = f.cedula || '';
  document.getElementById('apellidos_nombres').value = f.apellidos_nombres || '';
  document.getElementById('sexo').value = f.sexo || '';
  document.getElementById('dependencia').value = f.dependencia || '';
  document.getElementById('servicio').value = f.servicio || '';
  document.getElementById('cohorte_promocion').value = f.cohorte_promocion || '';
  document.getElementById('institucion_origen').value = f.institucion_origen || '';
  document.getElementById('fecha_ingreso').value = f.fecha_ingreso || '';
  document.getElementById('fecha_nacimiento').value = f.fecha_nacimiento || '';
  document.getElementById('edad_funcionario').value = f.edad_funcionario || '';
  document.getElementById('fecha_oficio').value = f.fecha_oficio || '';
  document.getElementById('fecha_transferencia_normalizacion').value = f.fecha_transferencia_normalizacion || '';
  document.getElementById('tipo_movimiento').value = f.tipo_movimiento || '';
  document.getElementById('observaciones').value = f.observaciones || '';
  document.getElementById('fechas_egreso').value = f.fechas_egreso || '';
  document.getElementById('direccion').value = f.direccion || '';
  document.getElementById('telefono').value = f.telefono || '';

  // ✅ Cargar correo
  if (f.correo_electronico) {
    const parts = f.correo_electronico.split('@');
    if (parts.length === 2) {
      document.getElementById('correo_local').value = parts[0];
      document.getElementById('correo_dominio').value = parts[1];
    }
  }

  // ✅ Función segura para selects: busca coincidencia flexible
  function setSelectValue(id, valueFromDB) {
    const select = document.getElementById(id);
    if (!select) return;

    const dbValue = (valueFromDB || '').toString().trim();
    let found = false;

    // Intentar coincidencia exacta por valor
    for (let opt of select.options) {
      if (opt.value === dbValue) {
        select.value = dbValue;
        found = true;
        break;
      }
    }

    // Si no hay coincidencia exacta, intentar por texto visible (ignorando mayúsculas/minúsculas)
    if (!found) {
      for (let opt of select.options) {
        if (opt.text.trim().toLowerCase() === dbValue.toLowerCase()) {
          select.value = opt.value;
          found = true;
          break;
        }
      }
    }

    // Si aún no se encuentra, dejar vacío
    if (!found) {
      select.value = '';
    }
  }

  // ✅ Aplicar a los campos problemáticos
  setSelectValue('rango', f.rango);
  setSelectValue('region', f.region);
  setSelectValue('estado', f.estado);
  setSelectValue('status', f.status);

  // ✅ Actualizar cabecera
  document.getElementById('headerNombre').textContent = f.apellidos_nombres || '—';
  const statusEl = document.getElementById('headerStatus');
  const rawStatus = (f.status || '').toString().trim();
  statusEl.textContent = rawStatus || '—';
  let bgColor = '#9e9e9e';
  if (rawStatus.toLowerCase() === 'activo') bgColor = '#2e7d32';
  else if (rawStatus === 'P') bgColor = '#1976d2';
  else if (rawStatus.toLowerCase() === 'destituido') bgColor = '#c62828';
  else if (rawStatus.toLowerCase() === 'suspendido') bgColor = '#ef6c00';
  else if (rawStatus === 'DA') bgColor = '#7b1fa2';
  statusEl.style.backgroundColor = bgColor;

  // ✅ Foto y autoresize
  cargarFotoActual(f.cedula);
  document.querySelectorAll('textarea.autoresize').forEach(el => {
    el.style.height = 'auto';
    el.style.height = el.scrollHeight + 'px';
  });
}

async function guardarCambios(e) {
  e.preventDefault();
  if (!currentCedula) return showAlert('⚠️ No hay cédula cargada.', 'error');

  const correo = `${document.getElementById('correo_local').value}@${document.getElementById('correo_dominio').value}`;
  const data = {
    apellidos_nombres: document.getElementById('apellidos_nombres').value.trim(),
    sexo: document.getElementById('sexo').value,
    rango: document.getElementById('rango').value,
    region: document.getElementById('region').value,
    estado: document.getElementById('estado').value,
    status: document.getElementById('status').value,
    fecha_nacimiento: document.getElementById('fecha_nacimiento').value,
    edad_funcionario: document.getElementById('edad_funcionario').value,
    direccion: document.getElementById('direccion').value,
    telefono: document.getElementById('telefono').value,
    correo_electronico: correo.includes('@') ? correo : null,
    dependencia: document.getElementById('dependencia').value,
    servicio: document.getElementById('servicio').value,
    cohorte_promocion: document.getElementById('cohorte_promocion').value,
    institucion_origen: document.getElementById('institucion_origen').value,
    fecha_ingreso: document.getElementById('fecha_ingreso').value,
    fecha_oficio: document.getElementById('fecha_oficio').value,
    fecha_transferencia_normalizacion: document.getElementById('fecha_transferencia_normalizacion').value,
    tipo_movimiento: document.getElementById('tipo_movimiento').value,
    fechas_egreso: document.getElementById('fechas_egreso').value,
    observaciones: document.getElementById('observaciones').value
  };

  try {
    const { error } = await client
      .from('auditoria_personal')
      .update(data)
      .eq('cedula', currentCedula);

    if (error) throw error;

    showAlert('✅ Ficha actualizada exitosamente.', 'success');
    setTimeout(() => window.location.reload(), 2000);

  } catch (err) {
    console.error(err);
    showAlert(`❌ Error al guardar: ${err.message}`, 'error');
  }
}
</script>
</body>
</html>
