<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Modificar Ficha | RRHH</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #fafafa;
      font-family: 'Inter', sans-serif;
      color: #2d2d2d;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    .header {
      text-align: center;
      margin-bottom: 24px;
    }
    .header img {
      width: 90px;
      margin-bottom: 16px;
    }
    .header h1 {
      font-size: 24px;
      font-weight: 700;
      color: #2d2d2d;
    }
    .header .subtitle {
      font-size: 16px;
      color: #722F37;
      font-weight: 600;
      margin-top: 8px;
    }
    .user-info {
      background: white;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 24px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
      border: 1px solid #eee;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      margin-bottom: 24px;
      border: 1px solid #eee;
    }
    .card h2 {
      font-size: 20px;
      margin-bottom: 20px;
      color: #722F37;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      font-weight: 600;
      color: #333;
    }
    input, select, textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
      background: #fdfdfd;
    }
    .btn {
      background-color: #722F37;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:hover {
      background-color: #5e262d;
    }
    .btn-outline {
      background: transparent;
      border: 1px solid #722F37;
      color: #722F37;
    }
    .alert {
      padding: 12px;
      border-radius: 8px;
      margin: 16px 0;
      display: none;
    }
    .alert-success { background: #e8f5e9; color: #2e7d32; }
    .alert-error { background: #ffebee; color: #c62828; }
    .breadcrumb {
      background: #f8f9fa;
      border-radius: 12px;
      padding: 12px 20px;
      margin-bottom: 24px;
      font-size: 14px;
      color: #555;
    }
    .breadcrumb a { color: #722F37; text-decoration: none; font-weight: 600; }
    .breadcrumb span { margin: 0 8px; color: #888; }
    .status-indicator {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 13px;
      margin-left: 8px;
      color: white;
    }
    .photo-container {
      width: 120px;
      height: 150px;
      margin: 0 auto 16px;
      border: 2px dashed #ccc;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #f9f9f9;
    }
    .photo-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
  </style>
</head>
<body>
<div class="container">
  <div class="breadcrumb">
    <a href="../index.html">Inicio</a> <span>›</span>
    <a href="index.html">RRHH</a> <span>›</span>
    <strong>Modificar Ficha</strong>
  </div>
  <div class="header">
    <img src="https://raw.githubusercontent.com/icapnacional/sistema-expedientes/main/Logo.png" alt="ICAP Nacional - PNB" />
    <h1>Inspectable para el Control de la Actuación Policial</h1>
    <div class="subtitle">• Modificación de Fichas •</div>
  </div>
  <div class="user-info">
    <strong>Usuario:</strong> <span id="userEmail">—</span> |
    <strong>Rol:</strong> <span id="userRol">—</span>
  </div>

  <div class="card">
    <h2>✏️ Modificar Datos del Funcionario</h2>
    <div id="alertMessage" class="alert"></div>
    
    <div class="form-group">
      <label for="cedula_buscar">Cédula del Funcionario (8 dígitos) *</label>
      <input type="text" id="cedula_buscar" inputmode="numeric" maxlength="8" placeholder="Ej: 25275015">
      <button type="button" id="btnBuscar" class="btn" style="margin-top:8px; width:100%;">🔍 Buscar en Auditoría Personal</button>
    </div>

    <div id="datosFuncionario" style="display:none; margin-top:20px;">
      <div style="text-align:center; margin-bottom:16px;">
        <div class="photo-container" id="photoContainer">🪪</div>
      </div>
      <strong>C.I. <span id="headerCedula">—</span></strong> •
      <span id="headerNombre">—</span>
      <span id="headerStatus" class="status-indicator" style="background:#ccc;"></span>
    </div>

    <form id="modificarForm" style="display:none; margin-top:24px;">
      <input type="hidden" id="cedula_hidden">

      <div class="grid-2">
        <div class="form-group">
          <label for="apellidos_nombres">Apellidos y Nombres *</label>
          <input type="text" id="apellidos_nombres" required>
        </div>
        <div class="form-group">
          <label for="rango">Rango *</label>
          <select id="rango" required>
            <option value="">Seleccione</option>
            <option value="General">General</option>
            <option value="Coronel">Coronel</option>
            <option value="Teniente Coronel">Teniente Coronel</option>
            <option value="Mayor">Mayor</option>
            <option value="Capitán">Capitán</option>
            <option value="Teniente">Teniente</option>
            <option value="Subteniente">Subteniente</option>
            <option value="Sargento Mayor">Sargento Mayor</option>
            <option value="Sargento Primero">Sargento Primero</option>
            <option value="Sargento">Sargento</option>
            <option value="Cabo">Cabo</option>
            <option value="Oficial">Oficial</option>
            <option value="Alumno">Alumno</option>
          </select>
        </div>
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label for="region">Región *</label>
          <select id="region" required>
            <option value="">Seleccione</option>
            <option value="capital">Capital</option>
            <option value="occidental">Occidental</option>
            <option value="los llanos">Los Llanos</option>
            <option value="los andes">Los Andes</option>
            <option value="guayana">Guayana</option>
            <option value="insular">Insular</option>
            <option value="central">Central</option>
            <option value="oriental">Oriental</option>
          </select>
        </div>
        <div class="form-group">
          <label for="estado">Estado *</label>
          <select id="estado" required>
            <option value="">Seleccione</option>
            <option value="Amazonas">Amazonas</option>
            <option value="Anzoátegui">Anzoátegui</option>
            <option value="Apure">Apure</option>
            <option value="Aragua">Aragua</option>
            <option value="Barinas">Barinas</option>
            <option value="Bolívar">Bolívar</option>
            <option value="Carabobo">Carabobo</option>
            <option value="Cojedes">Cojedes</option>
            <option value="Delta Amacuro">Delta Amacuro</option>
            <option value="Distrito Capital">Distrito Capital</option>
            <option value="Falcón">Falcón</option>
            <option value="Guárico">Guárico</option>
            <option value="Lara">Lara</option>
            <option value="Mérida">Mérida</option>
            <option value="Miranda">Miranda</option>
            <option value="Monagas">Monagas</option>
            <option value="Nueva Esparta">Nueva Esparta</option>
            <option value="Portuguesa">Portuguesa</option>
            <option value="Sucre">Sucre</option>
            <option value="Táchira">Táchira</option>
            <option value="Trujillo">Trujillo</option>
            <option value="Vargas">Vargas</option>
            <option value="Yaracuy">Yaracuy</option>
            <option value="Zulia">Zulia</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label for="status">Estatus *</label>
        <select id="status" required>
          <option value="">Seleccione</option>
          <option value="activo">Activo</option>
          <option value="P">P</option>
          <option value="destituido">Destituido</option>
          <option value="suspendido">Suspendido</option>
          <option value="DA">DA</option>
        </select>
      </div>

      <!-- Más campos si los necesitas -->

      <div style="text-align:right; margin-top:20px;">
        <button type="button" class="btn btn-outline" onclick="history.back()">← Cancelar</button>
        <button type="submit" class="btn">💾 Guardar Cambios</button>
      </div>
    </form>
  </div>
</div>

<script>
function showAlert(msg, type) {
  const alertDiv = document.getElementById('alertMessage');
  alertDiv.textContent = msg;
  alertDiv.className = 'alert ' + (type === 'success' ? 'alert-success' : 'alert-error');
  alertDiv.style.display = msg ? 'block' : 'none';
}

const SUPABASE_URL = 'https://xvqcgdbdwrocfcdfqpxv.supabase.co';
const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh2cWNnZGJkd3JvY2ZjZGZxcHh2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjUwMjk4MjAsImV4cCI6MjA4MDYwNTgyMH0.Xjh4Dvq9A9lQKVPUv95i0MKikspYLPoNLm_6qFgYxmw';
const client = supabase.createClient(SUPABASE_URL, ANON_KEY);

document.addEventListener('DOMContentLoaded', async () => {
  try {
    const { data: { session }, error } = await client.auth.getSession();
    if (error || !session) return window.location.href = '../index.html';

    const { data: perfil, error: pErr } = await client
      .from('perfiles')
      .select('email, rol')
      .eq('id', session.user.id)
      .single();

    if (pErr || !perfil || (perfil.rol !== 'admin' && perfil.rol !== 'moderador')) {
      alert('🔒 Acceso restringido.');
      return window.location.href = '../index.html';
    }

    document.getElementById('userEmail').textContent = perfil.email;
    document.getElementById('userRol').textContent =
      perfil.rol === 'admin' ? 'Administrador' : 'Moderador';

    document.getElementById('btnBuscar').addEventListener('click', buscarFuncionario);
    document.getElementById('cedula_buscar').addEventListener('keypress', e => {
      if (e.key === 'Enter') buscarFuncionario();
    });
    document.getElementById('modificarForm').addEventListener('submit', guardarCambios);

  } catch (err) {
    console.error(err);
    window.location.href = '../index.html';
  }
});

async function buscarFuncionario() {
  const cedula = document.getElementById('cedula_buscar').value.trim();
  if (!/^\d{8}$/.test(cedula)) {
    showAlert('⚠️ Cédula debe tener 8 dígitos.', 'error');
    return;
  }

  try {
    const { data, error } = await client
      .from('auditoria_personal')
      .select('*')
      .eq('cedula', cedula)
      .single();

    if (error || !data) throw new Error('No encontrado');

    cargarDatosFormulario(data);
    cargarFoto(cedula);

  } catch (err) {
    showAlert('❌ Cédula no encontrada en Auditoría Personal.', 'error');
    document.getElementById('datosFuncionario').style.display = 'none';
    document.getElementById('modificarForm').style.display = 'none';
  }
}

function cargarFoto(cedula) {
  const photoContainer = document.getElementById('photoContainer');
  photoContainer.innerHTML = '🪪';
  const extensions = ['jpeg', 'jpg', 'png'];
  let fotoCargada = false;
  for (const ext of extensions) {
    const path = `foto_${cedula}.${ext}`;
    client.storage
      .from('fotos_funcionarios')
      .createSignedUrl(path, 3600)
      .then(({ data, error }) => {
        if (!error && data?.signedUrl && !fotoCargada) {
          const img = document.createElement('img');
          img.src = data.signedUrl;
          img.style.width = '100%';
          img.style.height = '100%';
          img.style.objectFit = 'cover';
          photoContainer.innerHTML = '';
          photoContainer.appendChild(img);
          fotoCargada = true;
        }
      })
      .catch(() => {});
  }
}

// ✅ FUNCIÓN CORREGIDA: carga segura de select y coloreado de status
function cargarDatosFormulario(f) {
  // Campos ocultos y visibles
  document.getElementById('cedula_hidden').value = f.cedula;
  document.getElementById('cedula_buscar').value = f.cedula;
  document.getElementById('apellidos_nombres').value = f.apellidos_nombres || '';

  // ✅ Función segura para selects
  const safeSetSelect = (id, value) => {
    const el = document.getElementById(id);
    if (el) {
      const valStr = (value || '').toString().trim();
      if ([...el.options].some(opt => opt.value === valStr)) {
        el.value = valStr;
      } else {
        el.value = '';
      }
    }
  };

  // ✅ Cargar campos desde auditoria_personal
  safeSetSelect('rango', f.rango);
  safeSetSelect('region', f.region);
  safeSetSelect('estado', f.estado);
  safeSetSelect('status', f.status);

  // ✅ Mostrar datos en cabecera
  document.getElementById('headerCedula').textContent = f.cedula;
  document.getElementById('headerNombre').textContent = f.apellidos_nombres || '—';

  // ✅ Colorear status (normalizado)
  const statusEl = document.getElementById('headerStatus');
  const rawStatus = (f.status || '').toString().trim();
  const statusLower = rawStatus.toLowerCase();
  statusEl.textContent = rawStatus || '—';
  let bgColor = '#9e9e9e';
  if (['activo', 'active'].includes(statusLower)) bgColor = '#2e7d32';
  else if (['p', 'proceso'].includes(statusLower)) bgColor = '#1976d2';
  else if (['destituido', 'd'].includes(statusLower)) bgColor = '#c62828';
  else if (['suspendido', 's'].includes(statusLower)) bgColor = '#ef6c00';
  else if (['da', 'd.a.'].includes(statusLower)) bgColor = '#7b1fa2';
  statusEl.style.backgroundColor = bgColor;

  // Mostrar formulario
  document.getElementById('datosFuncionario').style.display = 'block';
  document.getElementById('modificarForm').style.display = 'block';
  showAlert('✅ Datos cargados.', 'success');
}

async function guardarCambios(e) {
  e.preventDefault();
  const cedula = document.getElementById('cedula_hidden').value;
  if (!cedula) return showAlert('⚠️ No hay cédula cargada.', 'error');

  const data = {
    apellidos_nombres: document.getElementById('apellidos_nombres').value.trim(),
    rango: document.getElementById('rango').value,
    region: document.getElementById('region').value,
    estado: document.getElementById('estado').value,
    status: document.getElementById('status').value
  };

  if (!data.apellidos_nombres || !data.rango || !data.region || !data.estado || !data.status) {
    return showAlert('⚠️ Todos los campos son obligatorios.', 'error');
  }

  try {
    const { error } = await client
      .from('auditoria_personal')
      .update(data)
      .eq('cedula', cedula);

    if (error) throw error;

    showAlert('✅ Ficha actualizada exitosamente.', 'success');
    setTimeout(() => window.location.reload(), 2000);

  } catch (err) {
    console.error(err);
    showAlert(`❌ Error al guardar: ${err.message}`, 'error');
  }
}
</script>
</body>
</html>
