async function buscarPorCedula() {
const cedula = document.getElementById('searchCedula').value.trim();
if (!/^\d{8}$/.test(cedula)) {
showAlert('⚠️ Ingresa una cédula válida de 8 dígitos.', 'error');
return;
}
showAlert('🔍 Buscando...', '');
try {
const { data, error } = await client
.from('auditoria_personal')
.select('*')
.eq('cedula', cedula)
.single();
if (error || !data) {
showAlert(`❌ Cédula ${cedula} no encontrada en auditoría.`, 'error');
return;
}
cargarDatosFormulario(data);
document.getElementById('modificarForm').style.display = 'block';
showAlert('✅ Datos cargados. Puedes editarlos.', 'success');
} catch (err) {
showAlert('❌ Error al buscar: ' + (err.message || 'intente nuevamente'), 'error');
}
}

function cargarDatosFormulario(f) {
  currentCedula = f.cedula;
  document.getElementById('headerCedula').textContent = f.cedula;
  document.getElementById('cedula').value = f.cedula || '';
  document.getElementById('apellidos_nombres').value = f.apellidos_nombres || '';
  document.getElementById('sexo').value = f.sexo || '';
  document.getElementById('dependencia').value = f.dependencia || '';
  document.getElementById('servicio').value = f.servicio || '';
  document.getElementById('cohorte_promocion').value = f.cohorte_promocion || '';
  document.getElementById('institucion_origen').value = f.institucion_origen || '';
  document.getElementById('fecha_ingreso').value = f.fecha_ingreso || '';
  document.getElementById('fecha_nacimiento').value = f.fecha_nacimiento || '';
  document.getElementById('edad_funcionario').value = f.edad_funcionario || '';
  document.getElementById('fecha_oficio').value = f.fecha_oficio || '';
  document.getElementById('fecha_transferencia_normalizacion').value = f.fecha_transferencia_normalizacion || '';
  document.getElementById('tipo_movimiento').value = f.tipo_movimiento || '';
  document.getElementById('observaciones').value = f.observaciones || '';
  document.getElementById('fechas_egreso').value = f.fechas_egreso || '';
  document.getElementById('direccion').value = f.direccion || '';
  document.getElementById('telefono').value = f.telefono || '';

  // ✅ CORRECCIÓN: Función mejorada para selects
  const setSelectValue = (id, valueFromDB) => {
    const select = document.getElementById(id);
    if (!select) return;
    const cleanDB = (valueFromDB || '').toString().trim();
    let found = false;

    // Buscar por valor exacto (sin normalizar)
    for (let opt of select.options) {
      if (opt.value === cleanDB) {
        select.value = cleanDB;
        found = true;
        break;
      }
    }

    // Si no se encuentra, buscar por texto visible ignorando mayúsculas/minúsculas
    if (!found) {
      for (let opt of select.options) {
        if (opt.text.trim().toLowerCase() === cleanDB.toLowerCase()) {
          select.value = opt.value;
          found = true;
          break;
        }
      }
    }

    // Si sigue sin coincidir, intentar normalizar el valor de la BD
    if (!found) {
      const normalizedDB = cleanDB
        .toLowerCase()
        .replace(/á/g, 'a')
        .replace(/é/g, 'e')
        .replace(/í/g, 'i')
        .replace(/ó/g, 'o')
        .replace(/ú/g, 'u');
      for (let opt of select.options) {
        const normalizedOpt = opt.text.trim().toLowerCase()
          .replace(/á/g, 'a')
          .replace(/é/g, 'e')
          .replace(/í/g, 'i')
          .replace(/ó/g, 'o')
          .replace(/ú/g, 'u');
        if (normalizedOpt === normalizedDB) {
          select.value = opt.value;
          found = true;
          break;
        }
      }
    }

    // Si nada funciona, dejar vacío
    if (!found) {
      select.value = '';
    }
  };

  setSelectValue('rango', f.rango);
 setSelectValue('rango', f.rango);

// ✅ Carga especial para 'region' con coincidencia flexible
const regionSelect = document.getElementById('region');
const dbRegion = (f.region || '').toString().trim();
let regionMatched = false;
for (const opt of regionSelect.options) {
  if (
    opt.value === dbRegion ||
    opt.text.trim().toLowerCase() === dbRegion.toLowerCase() ||
    opt.value.toLowerCase() === dbRegion.toLowerCase()
  ) {
    regionSelect.value = opt.value;
    regionMatched = true;
    break;
  }
}
if (!regionMatched) {
  regionSelect.value = '';
}

setSelectValue('estado', f.estado);
setSelectValue('status', f.status); // ✅ Ahora sí funcionará
  setSelectValue('estado', f.estado);
  setSelectValue('status', f.status);

  // Cabecera
  document.getElementById('headerNombre').textContent = f.apellidos_nombres || '—';
  const statusEl = document.getElementById('headerStatus');
  const rawStatus = (f.status || '').toString().trim();
  statusEl.textContent = rawStatus || '—';
  let bgColor = '#9e9e9e';
  if (rawStatus.toLowerCase() === 'activo') bgColor = '#2e7d32';
  else if (rawStatus === 'P') bgColor = '#1976d2';
  else if (rawStatus.toLowerCase() === 'destituido') bgColor = '#c62828';
  else if (rawStatus.toLowerCase() === 'suspendido') bgColor = '#ef6c00';
  else if (rawStatus === 'DA') bgColor = '#7b1fa2';
  statusEl.style.backgroundColor = bgColor;

  // Correo
  if (f.correo_electronico) {
    const parts = f.correo_electronico.split('@');
    if (parts.length === 2) {
      document.getElementById('correo_local').value = parts[0];
      document.getElementById('correo_dominio').value = parts[1];

  // Foto y autoresize
  cargarFotoActual(f.cedula);
  document.querySelectorAll('textarea.autoresize').forEach(el => {
    el.style.height = 'auto';
    el.style.height = el.scrollHeight + 'px';

}
async function cargarFotoActual(cedula) {
const container = document.getElementById('photoContainer');
container.innerHTML = '🪪';
const extensions = ['jpeg', 'jpg', 'png'];
for (const ext of extensions) {
const path = `foto_${cedula}.${ext}`;
try {
const { data, error } = await client.storage
.from('fotos_funcionarios')
.createSignedUrl(path, 3600);
if (error) continue;
if (data?.signedUrl) {
const img = new Image();
img.crossOrigin = 'anonymous';
img.onload = () => {
container.innerHTML = '';
container.appendChild(img);
};
img.onerror = () => {};
img.src = data.signedUrl;
return;
}
} catch (err) {
continue;
}
}
}
function previsualizarFoto(e) {
const file = e.target.files[0];
if (!file) return;
const reader = new FileReader();
reader.onload = (ev) => {
const img = new Image();
img.src = ev.target.result;
img.onload = () => {
const container = document.getElementById('photoContainer');
container.innerHTML = '';
container.appendChild(img);
};
};
reader.readAsDataURL(file);
}

const local = document.getElementById('correo_local').value.trim();

sexo: document.getElementById('sexo').value,

estado: document.getElementById('estado').value,
servicio: document.getElementById('servicio').value.trim(),
cohorte_promocion: document.getElementById('cohorte_promocion').value.trim(),
institucion_origen: document.getElementById('institucion_origen').value.trim(),
fecha_ingreso: document.getElementById('fecha_ingreso').value || null,
telefono: telefono,
status: document.getElementById('status').value,
fecha_nacimiento: document.getElementById('fecha_nacimiento').value || null,
edad_funcionario: parseInt(document.getElementById('edad_funcionario').value) || null,
fecha_oficio: document.getElementById('fecha_oficio').value || null,
fecha_transferencia_normalizacion: document.getElementById('fecha_transferencia_normalizacion').value || null,
tipo_movimiento: document.getElementById('tipo_movimiento').value.trim(),
observaciones: document.getElementById('observaciones').value.trim(),
fechas_egreso: document.getElementById('fechas_egreso').value.trim(),
direccion: document.getElementById('direccion').value.trim(),
correo_electronico: correo
};
const required = ['apellidos_nombres', 'rango', 'estado', 'region', 'status'];
for (let field of required) {
if (!data[field]) {
return showAlert(`⚠️ El campo "${field}" es obligatorio.`, 'error');
}
}
try {
const { error } = await client
.from('auditoria_personal')
.update(data)
.eq('cedula', currentCedula);
if (error) throw error;
const photoInput = document.getElementById('photoInput');
if (photoInput.files.length > 0) {
const file = photoInput.files[0];
const ext = file.name.split('.').pop().toLowerCase();
const fileName = `foto_${currentCedula}.${ext}`;
const { error: upErr } = await client.storage
.from('fotos_funcionarios')
.upload(fileName, file, { upsert: true });
if (upErr) console.warn('Foto subida con advertencia:', upErr.message);
}
try {
const sessionResponse = await client.auth.getSession();
const session = sessionResponse?.data?.session;
if (session) {
const { data: perfil } = await client
.from('perfiles')
.select('email, rol')
.eq('id', session.user.id)
.single();
if (perfil) {
await client.from('rrhh_logs').insert({
user_id: session.user.id,
email: perfil.email,
rol: perfil.rol,
accion: 'edicion',
cedula_afectada: currentCedula,
nombre_afectado: data.apellidos_nombres,
detalles: {
nuevo_status: data.status,
nuevo_telefono: data.telefono
}
});
}
}
} catch (logErr) {
console.warn('⚠️ Log de edición no guardado:', logErr.message);
}
showAlert('✅ Ficha actualizada exitosamente.', 'success');
setTimeout(() => location.reload(), 1500);
} catch (err) {
console.error('Error actualizando:', err);
showAlert(`❌ Error: ${err.message || 'verifique los datos'}`, 'error');
}
}
function showAlert(msg, type) {
alertDiv.textContent = msg;
alertDiv.className = 'alert ' + (type === 'success' ? 'alert-success' : 'alert-error');
alertDiv.style.display = msg ? 'block' : 'none';
}
</script>
</body>
</html>
