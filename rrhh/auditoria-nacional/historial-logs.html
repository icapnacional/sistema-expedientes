<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Historial de Actividades | RRHH</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #fafafa; padding: 20px; }
    .container { max-width: 1200px; margin: 0 auto; }
    .header img { width: 90px; margin-bottom: 16px; }
    .card { background: white; border-radius: 12px; padding: 24px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); margin-bottom: 24px; }
    .filters { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
    input, select, button { padding: 10px 16px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; }
    button { background: #722F37; color: white; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid #eee; }
    th { background: #f8f9fa; font-weight: 600; }
    .rol-admin { color: #c62828; font-weight: 600; }
    .rol-moderador { color: #2e7d32; font-weight: 600; }
    .rol-consultor { color: #1565c0; font-weight: 600; }
    .accion-consulta { background: #e3f2fd; color: #0d47a1; padding: 4px 8px; border-radius: 4px; }
    .accion-registro { background: #e8f5e9; color: #1b5e20; padding: 4px 8px; border-radius: 4px; }
    .accion-edicion { background: #fff8e1; color: #e65100; padding: 4px 8px; border-radius: 4px; }
    .pagination { display: flex; justify-content: center; gap: 6px; margin-top: 24px; }
    .page-btn { width: 36px; height: 36px; border: 1px solid #ddd; background: white; border-radius: 6px; cursor: pointer; }
    .page-btn.active { background: #722F37; color: white; }
  </style>
</head>
<body>
  <div class="container">
<div class="breadcrumb">
  <a href="../../index.html">Inicio</a> <span>›</span>
  <a href="../index.html">RRHH</a> <span>›</span>
  <strong>Historial</strong>
</div>
    <div class="header" style="text-align:center; margin-bottom:24px;">
      <img src="https://raw.githubusercontent.com/icapnacional/sistema-expedientes/main/Logo.png" alt="ICAP Nacional" />
      <h1>📜 Historial de Actividades — RRHH</h1>
    </div>
    <div class="card">
      <div class="filters">
        <input type="text" id="searchLogs" placeholder="Buscar por cédula, nombre o email" />
        <select id="filterAccion">
          <option value="">Todas las acciones</option>
          <option value="consulta">Consulta</option>
          <option value="registro">Registro</option>
          <option value="edicion">Edición</option>
        </select>
        <select id="filterRol">
          <option value="">Todos los roles</option>
          <option value="admin">Administrador</option>
          <option value="moderador">Moderador</option>
          <option value="consultor">Consultor</option>
        </select>
        <button id="btnFiltrar">🔍 Filtrar</button>
        <button id="btnExportar" style="background:#1976d2;">📥 Exportar CSV</button>
      </div>
      <div id="logsTable">
        <table>
          <thead>
            <tr>
              <th>Fecha y Hora</th>
              <th>Usuario</th>
              <th>Rol</th>
              <th>Acción</th>
              <th>Cédula</th>
              <th>Funcionario</th>
              <th>Detalles</th>
            </tr>
          </thead>
          <tbody id="logsBody">
            <tr><td colspan="7" style="text-align:center">Cargando historial...</td></tr>
          </tbody>
        </table>
      </div>
      <div class="pagination" id="pagination"></div>
    </div>
  </div>
<script>
  const SUPABASE_URL = 'https://xvqcgdbdwrocfcdfqpxv.supabase.co';
  const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh2cWNnZGJkd3JvY2ZjZGZxcHh2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjUwMjk4MjAsImV4cCI6MjA4MDYwNTgyMH0.Xjh4Dvq9A9lQKVPUv95i0MKikspYLPoNLm_6qFgYxmw';
  const client = supabase.createClient(SUPABASE_URL, ANON_KEY);
  let currentPage = 1;
  const perPage = 20;
  function mostrarDetalles(log) {
    let overlay = document.getElementById('logOverlay');
    if (!overlay) {
      overlay = document.createElement('div');
      overlay.id = 'logOverlay';
      overlay.style.cssText = `
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.6); z-index: 1000; display: flex;
        align-items: center; justify-content: center; padding: 20px;
      `;
      document.body.appendChild(overlay);

      const modal = document.createElement('div');
      modal.id = 'logModal';
      modal.style.cssText = `
        background: white; border-radius: 16px; width: 100%; max-width: 800px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.3); overflow: hidden;
      `;
      overlay.appendChild(modal);
    }

    const modal = document.getElementById('logModal');
    const fecha = new Date(log.created_at).toLocaleString('es-VE', {
      year: 'numeric', month: 'long', day: 'numeric',
      hour: '2-digit', minute: '2-digit', second: '2-digit'
    });
    let detallesHTML = '<pre style="margin:0; white-space:pre-wrap; word-break:break-word;">' + 
      (log.detalles ? JSON.stringify(log.detalles, null, 2) : '{}') + 
      '</pre>';

    modal.innerHTML = `
      <div style="background:#722F37; color:white; padding:16px 24px; display:flex; justify-content:space-between; align-items:center;">
        <h2 style="margin:0; font-size:20px;">🔍 Detalles del Registro</h2>
        <button id="btnCerrarModal" style="background:#c62828; border:none; width:32px; height:32px; border-radius:50%; font-weight:bold; cursor:pointer;">×</button>
      </div>
      <div style="padding:24px; max-height:70vh; overflow:auto;">
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:24px;">
          <div><strong>📅 Fecha y Hora:</strong><br><span style="color:#2d2d2d;">${fecha}</span></div>
          <div><strong>👤 Usuario:</strong><br><span style="color:#2d2d2d;">${log.email || '—'}</span></div>
          <div><strong>🛡️ Rol:</strong><br><span style="color:#2d2d2d; font-weight:600;">${log.rol || '—'}</span></div>
          <div><strong>🔧 Acción:</strong><br><span style="color:#2d2d2d; font-weight:600;">${log.accion || '—'}</span></div>
          <div><strong>🆔 Cédula afectada:</strong><br><span style="color:#2d2d2d;">${log.cedula_afectada || '—'}</span></div>
          <div><strong>📛 Funcionario:</strong><br><span style="color:#2d2d2d;">${log.nombre_afectado || '—'}</span></div>
        </div>
        <div style="margin-top:24px;">
          <h3 style="margin:0 0 12px; color:#722F37;">📝 Detalles completos</h3>
          <div style="background:#f8f9fa; padding:16px; border-radius:8px; font-family:monospace; font-size:14px;">
            ${detallesHTML}
          </div>
        </div>
      </div>
    `;
    document.getElementById('btnCerrarModal').onclick = cerrarModal;
    overlay.onclick = (e) => { if (e.target === overlay) cerrarModal(); };
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') cerrarModal(); });
    overlay.style.display = 'flex';
  }

  function cerrarModal() {
    const overlay = document.getElementById('logOverlay');
    if (overlay) overlay.style.display = 'none';
  }
  function renderLogs(logs) {
    const tbody = document.getElementById('logsBody');
    if (logs.length === 0) {
      tbody.innerHTML = '<tr><td colspan="7" style="text-align:center">No hay registros.</td></tr>';
      return;
    }
    tbody.innerHTML = logs.map((log, i) => {
      const fecha = new Date(log.created_at).toLocaleString('es-VE');
      const rolClass = `rol-${String(log.rol || 'unknown').toLowerCase()}`;
      const accionClass = `accion-${String(log.accion || 'unknown').toLowerCase()}`;
      return `
        <tr style="cursor:pointer; transition:background 0.2s;" onclick="mostrarDetalles(${JSON.stringify(log).replace(/"/g, '&quot;')})">
          <td>${fecha}</td>
          <td>${log.email || '—'}</td>
          <td><span class="${rolClass}">${log.rol || '—'}</span></td>
          <td><span class="${accionClass}">${log.accion || '—'}</span></td>
          <td>${log.cedula_afectada || '—'}</td>
          <td>${log.nombre_afectado || '—'}</td>
          <td style="max-width:200px; overflow:hidden; text-overflow:ellipsis;">
            ${log.detalles ? JSON.stringify(log.detalles).substring(0,50) + '…' : '—'}
          </td>
        </tr>
      `;
    }).join('');
  }
  document.addEventListener('DOMContentLoaded', async () => {
    const sessionResponse = await client.auth.getSession();
    const session = sessionResponse?.data?.session;
    if (!session) return window.location.href = '../index.html';
    const { data: perfil } = await client
      .from('perfiles')
      .select('rol')
      .eq('id', session.user.id)
      .single();
    const userRol = String(perfil?.rol || '').trim();
if (userRol !== 'admin') {
  alert('🔒 Acceso denegado: solo el Administrador puede ver el historial.');
  window.location.href = '../index.html';
  return;
}
    loadLogs();
    document.getElementById('btnFiltrar').addEventListener('click', loadLogs);
    document.getElementById('searchLogs').addEventListener('keypress', e => {
      if (e.key === 'Enter') loadLogs();
    });
  });

  async function loadLogs() {
    const search = document.getElementById('searchLogs').value.trim();
    const accion = document.getElementById('filterAccion').value;
    const rol = document.getElementById('filterRol').value;
    try {
      let query = client
        .from('rrhh_logs')
        .select('*', { count: 'exact' })
        .order('created_at', { ascending: false });
      if (search) {
        query = query.or(`cedula_afectada.ilike.%${search}%,nombre_afectado.ilike.%${search}%,email.ilike.%${search}%`);
      }
      if (accion) query = query.eq('accion', accion);
      if (rol) query = query.eq('rol', rol);
      const from = (currentPage - 1) * perPage;
      const { data, error, count } = await query.range(from, from + perPage - 1);
      if (error) throw error;
      renderLogs(data);
      renderPagination(Math.ceil(count / perPage));
    } catch (err) {
      console.error('❌ Error al cargar logs:', err);
      document.getElementById('logsBody').innerHTML = `<tr><td colspan="7" style="color:#c00;text-align:center">Error: ${err.message || 'No se pudo cargar el historial'}</td></tr>`;
    }
  }

  function renderPagination(totalPages) {
    const div = document.getElementById('pagination');
    div.innerHTML = '';
    if (totalPages <= 1) return;
    const addBtn = (text, page, active = false, disabled = false) => {
      const btn = document.createElement('button');
      btn.className = 'page-btn' + (active ? ' active' : '') + (disabled ? ' disabled' : '');
      btn.textContent = text;
      if (!disabled) btn.onclick = () => { currentPage = page; loadLogs(); };
      div.appendChild(btn);
    };
    addBtn('«', 1, false, currentPage === 1);
    for (let i = Math.max(1, currentPage - 2); i <= Math.min(totalPages, currentPage + 2); i++) {
      addBtn(i, i, i === currentPage);
    }
    addBtn('»', totalPages, false, currentPage === totalPages);
  }
</script>
</body>
</html>
