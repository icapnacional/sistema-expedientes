<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ficha ICAP</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background-color: #f5f5f5;
    }
    .container {
      max-width: 900px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    h2 {
      text-align: center;
      color: #333;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    input, select, textarea {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }
    .btn {
      background-color: #007bff;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
    }
    .btn:hover {
      background-color: #0056b3;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }
    @media (max-width: 768px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>📄 Nueva Ficha ICAP</h2>

    <!-- Formulario -->
    <div class="form-group">
      <label for="cedula">Cédula de Identidad (8 dígitos)</label>
      <input type="text" id="cedula" maxlength="8" placeholder="Ej: 12345678" />
    </div>

    <div class="grid">
      <div class="form-group">
        <label for="nombre">Nombre y Apellidos</label>
        <input type="text" id="nombre" placeholder="Nombre completo" />
      </div>
      <div class="form-group">
        <label for="edad">Edad (años)</label>
        <input type="number" id="edad" min="18" max="99" placeholder="Edad" />
      </div>
    </div>

    <div class="form-group">
      <label for="fechaNacimiento">Fecha de Nacimiento</label>
      <input type="date" id="fechaNacimiento" />
    </div>

    <div class="grid">
      <div class="form-group">
        <label for="telefonoFunc">Teléfono del Funcionario</label>
        <input type="text" id="telefonoFunc" placeholder="0412-1234567" />
      </div>
      <div class="form-group">
        <label for="telefonoEmerg">Teléfono de Emergencia</label>
        <input type="text" id="telefonoEmerg" placeholder="0414-7654321" />
      </div>
    </div>

    <div class="form-group">
      <label for="correo">Correo Electrónico</label>
      <input type="email" id="correo" placeholder="ejemplo@gmail.com" />
    </div>

    <div class="form-group">
      <label for="nivelAcademico">Nivel Académico</label>
      <input type="text" id="nivelAcademico" placeholder="Licenciado, Técnico, etc." />
    </div>

    <div class="grid">
      <div class="form-group">
        <label for="fechaIngreso">Fecha de Ingreso al CPNB</label>
        <input type="date" id="fechaIngreso" />
      </div>
      <div class="form-group">
        <label for="fechaAscenso">Fecha del Último Ascenso</label>
        <input type="date" id="fechaAscenso" />
      </div>
    </div>

    <div class="form-group">
      <label for="antiguedad">Antigüedad en la Función Policial</label>
      <input type="text" id="antiguedad" placeholder="Ej: 5 años 3 meses" />
    </div>

    <div class="grid">
      <div class="form-group">
        <label for="estado">Estado</label>
        <select id="estado">
          <option value="">Seleccionar</option>
          <option value="activo">Activo</option>
          <option value="suspendido">Suspendido</option>
          <option value="destituido">Destituido</option>
          <option value="DA">DA</option>
          <option value="P">P</option>
        </select>
      </div>
      <div class="form-group">
        <label for="servicio">Servicio</label>
        <input type="text" id="servicio" placeholder="Ej: ICAP, DIPOL, etc." />
      </div>
    </div>

    <div class="form-group">
      <label for="direccion">Dirección de Habitación</label>
      <textarea id="direccion" rows="2" placeholder="Dirección completa"></textarea>
    </div>

    <div class="form-group">
      <label for="ultimoCargo">Último Cargo</label>
      <input type="text" id="ultimoCargo" placeholder="Ej: Inspector Jefe" />
    </div>

    <div class="form-group">
      <label for="rango">Rango</label>
      <select id="rango">
        <option value="">Seleccionar</option>
        <option value="comisario superior">Comisario Superior</option>
        <option value="comisario mayor">Comisario Mayor</option>
        <option value="comisario general">Comisario General</option>
        <option value="comisario jefe">Comisario Jefe</option>
        <option value="primer comisario">Primer Comisario</option>
        <option value="comisario">Comisario</option>
        <option value="inspector jefe">Inspector Jefe</option>
        <option value="primer inspector">Primer Inspector</option>
        <option value="inspector">Inspector</option>
      </select>
    </div>

    <div class="form-group">
      <label>
        <input type="checkbox" id="poseeCredencial" /> ¿Posee Credencial?
      </label>
      <input type="text" id="numeroCredencial" placeholder="Número de credencial" style="display:none; margin-top: 5px;" />
    </div>

    <button id="btnGuardar" class="btn">💾 Guardar Ficha</button>
  </div>

  <script type="module">
    // Importar Supabase
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

    // Configuración de Supabase (reemplaza con tus propios valores)
    const supabaseUrl = 'YOUR_SUPABASE_URL';
    const supabaseAnonKey = 'YOUR_SUPABASE_ANON_KEY';
    const supabase = createClient(supabaseUrl, supabaseAnonKey);

    // Mostrar/Ocultar campo de número de credencial
    document.getElementById('poseeCredencial').addEventListener('change', function () {
      const campo = document.getElementById('numeroCredencial');
      campo.style.display = this.checked ? 'block' : 'none';
    });

    // Función para guardar la ficha
    async function guardarFicha() {
      const cedula = document.getElementById('cedula').value.trim();
      const nombre = document.getElementById('nombre').value.trim();
      const edad = document.getElementById('edad').value.trim();
      const fechaNacimiento = document.getElementById('fechaNacimiento').value;
      const telefonoFunc = document.getElementById('telefonoFunc').value.trim();
      const telefonoEmerg = document.getElementById('telefonoEmerg').value.trim();
      const correo = document.getElementById('correo').value.trim();
      const nivelAcademico = document.getElementById('nivelAcademico').value.trim();
      const fechaIngreso = document.getElementById('fechaIngreso').value;
      const fechaAscenso = document.getElementById('fechaAscenso').value || null;
      const antiguedad = document.getElementById('antiguedad').value.trim();
      const estado = document.getElementById('estado').value;
      const servicio = document.getElementById('servicio').value.trim();
      const direccion = document.getElementById('direccion').value.trim();
      const ultimoCargo = document.getElementById('ultimoCargo').value.trim();
      const rango = document.getElementById('rango').value;
      const poseeCredencial = document.getElementById('poseeCredencial').checked;
      const numeroCredencial = poseeCredencial ? document.getElementById('numeroCredencial').value.trim() : null;

      // Validaciones básicas
      if (!cedula || !nombre || !edad || !fechaNacimiento || !telefonoFunc || !telefonoEmerg ||
          !correo || !nivelAcademico || !fechaIngreso || !antiguedad || !estado || !servicio ||
          !direccion || !ultimoCargo || !rango) {
        alert('⚠️ Por favor, complete todos los campos obligatorios.');
        return;
      }

      if (!/^\d{8}$/.test(cedula)) {
        alert('⚠️ La cédula debe tener exactamente 8 dígitos numéricos.');
        return;
      }

      try {
        // Obtener usuario autenticado
        const { data: { user } } = await supabase.auth.getUser();
        if (!user) {
          alert('❌ Debes estar autenticado para guardar una ficha.');
          return;
        }

        // Insertar en la tabla 'fichas'
        const { error } = await supabase
          .from('fichas')
          .insert([
            {
              cedula,
              nombre_apellidos: nombre,
              edad,
              fecha_nacimiento: fechaNacimiento,
              telefono_funcionario: telefonoFunc,
              telefono_emergencia: telefonoEmerg,
              correo_electronico: correo,
              nivel_academico: nivelAcademico,
              fecha_ingreso_cpn: fechaIngreso,
              fecha_ultimo_ascenso: fechaAscenso,
              antiguedad,
              estado,
              servicio,
              direccion_habitacion: direccion,
              ultimo_cargo: ultimoCargo,
              rango,
              posee_credencial: poseeCredencial,
              numero_credencial: numeroCredencial,
              creado_por: user.id
            }
          ]);

        if (error) throw error;

        alert('✅ ¡Ficha guardada exitosamente!');
        // Opcional: resetear formulario
        // document.querySelector('form')?.reset(); // si envuelve en <form>
        document.getElementById('numeroCredencial').style.display = 'none';
      } catch (err) {
        console.error('Error al guardar:', err);
        alert('❌ Error al guardar la ficha: ' + (err.message || 'Intente nuevamente.'));
      }
    }

    // 🟢 🔑 ¡CORRECCIÓN CLAVE! Vincular el botón con la función
    document.getElementById('btnGuardar').addEventListener('click', guardarFicha);
  </script>
</body>
</html>
