<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Vista Previa de la Ficha</title>
  <style>
    /* Estilos generales e impresión (NO MODIFICADOS) */
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f5f5f5;
    }

    .ficha-container {
      width: 25.4cm;
      height: 19.05cm;
      margin: 20px auto;
      padding: 10px;
      background: white;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      position: relative;
      box-sizing: border-box;
    }

    @media print {
      body {
        background: white;
      }
      .ficha-container {
        margin: 0;
        box-shadow: none;
        page-break-after: avoid;
      }
      .no-print {
        display: none !important;
      }
    }

    .header {
      text-align: center;
      font-weight: bold;
      margin-bottom: 10px;
      position: relative;
    }

    .logo-izq, .logo-der {
      position: absolute;
      top: 5px;
      width: 40px;
      height: auto;
    }
    .logo-izq { left: 5px; }
    .logo-der { right: 5px; }

    .ribbon {
      height: 8px;
      background: linear-gradient(to right, yellow, blue, red);
      margin: 5px 0;
    }

    .photo-frame {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 35mm;
      height: 45mm;
      border: 1px solid #ccc;
      overflow: hidden;
    }

    .cedula-frame {
      position: absolute;
      bottom: 10px;
      right: 10px;
      width: 85mm;
      height: 55mm;
      border: 1px solid #ccc;
      overflow: hidden;
    }

    .datos-principales {
      margin-top: 60px;
      margin-right: 100px;
    }

    .campo {
      display: flex;
      margin-bottom: 5px;
    }
    .campo label {
      width: 180px;
      font-weight: bold;
    }
    .campo span {
      flex: 1;
    }

    .estado-box {
      padding: 5px 10px;
      color: white;
      font-weight: bold;
      display: inline-block;
      margin-top: 5px;
      border-radius: 3px;
    }

    /* --- ESTILOS PARA VISTA PREVIA EN PANTALLA (MODIFICADOS AQUÍ) --- */
    @media screen {
      .photo-frame, .cedula-frame {
        position: relative !important;
        top: auto !important;
        right: auto !important;
        float: none !important;
        margin: 0 !important;
        border: none !important;
        width: auto !important;
        height: auto !important;
      }

      .foto-funcionario {
        position: relative !important;
        width: auto !important;
        height: auto !important;
        max-width: 180px !important;
        max-height: 225px !important;
        margin-top: 0 !important;
        margin-left: auto;
        display: block;
        clear: both;
      }

      .foto-cedula {
        position: relative !important;
        width: auto !important;
        height: auto !important;
        max-width: 250px !important;
        max-height: 170px !important;
        margin-top: 25px !important; /* Ajustado para coincidir con el recuadro inferior */
        margin-left: auto;
        display: block;
        clear: both;
      }
    }
  </style>
</head>
<body>

  <div class="ficha-container">
    <!-- Encabezado -->
    <div class="header">
      <img src="logo-izq.png" alt="Logo Izq" class="logo-izq no-print" />
      <img src="logo-der.png" alt="Logo Der" class="logo-der no-print" />
      <div>Inspectable para el Control de la Actuación Policial</div>
      <div>FICHA N°: — – 13 de enero de 2026 – ICAP</div>
      <div class="ribbon"></div>
    </div>

    <!-- Marco de foto del funcionario -->
    <div class="photo-frame">
      <img src="foto-funcionario.jpg" alt="Foto Funcionario" class="foto-funcionario" />
    </div>

    <!-- Marco de foto de cédula -->
    <div class="cedula-frame">
      <img src="foto-cedula.jpg" alt="Cédula" class="foto-cedula" />
    </div>

    <!-- Datos principales (ejemplo) -->
    <div class="datos-principales">
      <div class="campo"><label>RANGO:</label> <span>TENIENTE</span></div>
      <div class="campo"><label>NOMBRE Y APELLIDOS:</label> <span>JUAN PÉREZ</span></div>
      <div class="campo"><label>C.I:</label> <span>12345678</span></div>
      <div class="campo"><label>ESTADO:</label> <span class="estado-box" style="background-color: green;">ACTIVO</span></div>
      <!-- Más campos... -->
    </div>
  </div>

</body>
</html>
