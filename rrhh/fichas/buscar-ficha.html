<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Buscar Ficha - ICAP</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f5f5f5;
    }
    .container {
      max-width: 1200px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    h2 {
      text-align: center;
      margin-bottom: 20px;
    }
    #searchSection {
      margin-bottom: 20px;
    }
    #searchSection input {
      padding: 8px;
      width: 200px;
      margin-right: 10px;
    }
    #btnBuscar {
      padding: 8px 16px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    #btnBuscar:hover {
      background-color: #0056b3;
    }
    #fichaPreview {
      width: 25.4cm;
      height: 19.05cm;
      border: 1px solid #ccc;
      position: relative;
      margin: 20px auto;
      padding: 10px;
      box-sizing: border-box;
      background: white;
      display: none;
    }
    #actionButtons {
      text-align: center;
      margin-top: 20px;
    }
    .btn {
      padding: 10px 20px;
      margin: 0 10px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
    }
    #btnExportarPDF {
      background-color: #28a745;
      color: white;
    }
    #btnExportarPDF:hover {
      background-color: #218838;
    }
    #alertBox {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 15px;
      border-radius: 5px;
      color: white;
      font-weight: bold;
      display: none;
      z-index: 1000;
    }
    .success { background-color: #28a745; }
    .error { background-color: #dc3545; }
  </style>
</head>
<body>
  <div class="container">
    <h2>🔍 Buscar Ficha</h2>
    <div id="searchSection">
      <input type="text" id="cedulaInput" placeholder="Ingrese Cédula" maxlength="8" />
      <button id="btnBuscar">Buscar Ficha</button>
    </div>

    <div id="fichaPreview">
      <!-- Aquí se cargará la vista previa de la ficha -->
      <p style="text-align:center; color:#666;">Vista previa de la ficha aparecerá aquí...</p>
    </div>

    <div id="actionButtons">
      <!-- Botón de imprimir ELIMINADO -->
      <button id="btnExportarPDF" class="btn">📄 Exportar PDF</button>
    </div>
  </div>

  <div id="alertBox"></div>

  <!-- Librerías necesarias -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <script>
    // Acceso a módulos de jsPDF
    const { jsPDF } = window.jspdf;

    function showAlert(message, type) {
      const alertBox = document.getElementById('alertBox');
      alertBox.textContent = message;
      alertBox.className = type;
      alertBox.style.display = 'block';
      setTimeout(() => {
        alertBox.style.display = 'none';
      }, 3000);
    }

    // Simulación de carga de ficha (reemplázala con tu lógica real)
    document.getElementById('btnBuscar').addEventListener('click', () => {
      const cedula = document.getElementById('cedulaInput').value.trim();
      if (!cedula || cedula.length !== 8) {
        showAlert('⚠️ Ingrese una cédula válida de 8 dígitos.', 'error');
        return;
      }

      // Aquí normalmente harías una llamada fetch a tu backend
      // Por ahora, simulamos una carga exitosa
      const preview = document.getElementById('fichaPreview');
      preview.innerHTML = `
        <div style="font-size:14px; line-height:1.4;">
          <h3 style="text-align:center;">FICHA N°: — ${new Date().toLocaleDateString('es-VE')} – ICAP</h3>
          <p><strong>C.I:</strong> ${cedula}</p>
          <p><strong>Nombre y Apellidos:</strong> Juan Pérez</p>
          <p><strong>Rango:</strong> Inspector</p>
          <p><strong>Estado:</strong> Activo</p>
          <p><strong>Fecha de Ingreso:</strong> 15/03/2020</p>
          <p><strong>Edad:</strong> 35 años</p>
        </div>
      `;
      preview.style.display = 'block';
    });

    // ✅ Exportar PDF y ABRIR EN NUEVA PESTAÑA
    document.getElementById('btnExportarPDF').addEventListener('click', async () => {
      showAlert('Generando PDF...', 'success');
      try {
        const element = document.getElementById('fichaPreview');
        if (element.style.display === 'none') {
          showAlert('❌ No hay ficha para exportar', 'error');
          return;
        }

        const canvas = await html2canvas(element, {
          scale: 2,
          useCORS: true,
          logging: false,
          backgroundColor: null
        });

        const imgData = canvas.toDataURL('image/png');
        const pdf = new jsPDF('landscape', 'cm', [25.4, 19.05]);
        pdf.addImage(imgData, 'PNG', 0, 0, 25.4, 19.05);

        // Crear blob y URL
        const pdfBlob = pdf.output('blob');
        const pdfUrl = URL.createObjectURL(pdfBlob);

        // Abrir en nueva pestaña
        window.open(pdfUrl, '_blank');

        showAlert('✅ PDF abierto en nueva pestaña', 'success');
      } catch (err) {
        console.error(err);
        showAlert('❌ Error al generar PDF', 'error');
      }
    });
  </script>
</body>
</html>
