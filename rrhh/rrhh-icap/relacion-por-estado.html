<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Diagnóstico - Relación por Estado</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #f5f5f5; }
    .log { background: white; padding: 16px; margin: 12px 0; border-radius: 6px; }
    .error { color: #c00; }
    .success { color: #080; }
  </style>
</head>
<body>
  <h2>🔍 Diagnóstico de sesión y perfil</h2>
  <div id="logs"></div>

  <script>
    const SUPABASE_URL = 'https://xvqcgdbdwrocfcdfqpxv.supabase.co';
    const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh2cWNnZGJkd3JvY2ZjZGZxcHh2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjUwMjk4MjAsImV4cCI6MjA4MDYwNTgyMH0.Xjh4Dvq9A9lQKVPUv95i0MKikspYLPoNLm_6qFgYxmw';
    const client = supabase.createClient(SUPABASE_URL, ANON_KEY);

    function log(msg, isError = false) {
      const div = document.createElement('div');
      div.className = isError ? 'log error' : 'log success';
      div.textContent = msg;
      document.getElementById('logs').appendChild(div);
      console.log(msg);
    }

    async function diagnose() {
      log('🔍 Iniciando diagnóstico...');

      // Paso 1: Verificar sesión
      const {  { session }, error: authError } = await client.auth.getSession();
      
      if (authError) {
        log('❌ Error de autenticación: ' + authError.message, true);
        return;
      }

      if (!session) {
        log('⚠️ No hay sesión activa. ¿Estás logueado?', true);
        log('URL de login sugerida: ../index.html');
        return;
      }

      log('✅ Sesión activa. Usuario ID: ' + session.user.id);

      // Paso 2: Buscar perfil
      const {  perfil, error: profileError } = await client
        .from('perfiles')
        .select('rol, estados_asignados')
        .eq('id', session.user.id)
        .single();

      if (profileError) {
        log('❌ Error al cargar perfil: ' + profileError.message, true);
        log('💡 Asegúrate de que existe un registro en "perfiles" con id = "' + session.user.id + '"');
        return;
      }

      if (!perfil) {
        log('❌ No se encontró perfil para este usuario.', true);
        log('💡 Debes crear un registro en la tabla "perfiles" con el mismo "id" que el usuario de auth.');
        return;
      }

      log('✅ Perfil cargado:');
      log('   Rol: ' + perfil.rol);
      log('   Estados: ' + (perfil.estados_asignados?.join(', ') || 'ninguno'));

      // Si llegaste aquí, ¡todo está bien!
      log('🎉 ¡Todo correcto! Ahora puedes usar la versión completa.');
      // Opcional: redirigir a la versión real
      // window.location.href = 'relacion-por-estado-real.html';
    }

    diagnose();
  </script>
</body>
</html>
