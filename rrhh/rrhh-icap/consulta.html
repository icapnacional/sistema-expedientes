<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Consulta | RRHH ICAP</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #fafafa;
      color: #2d2d2d;
      padding: 20px;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
    }
    .header {
      text-align: center;
      margin-bottom: 24px;
    }
    .header img {
      width: 80px;
      margin-bottom: 16px;
    }
    .header h1 {
      font-size: 22px;
      font-weight: 700;
      color: #722F37;
      margin-bottom: 8px;
    }
    .breadcrumb {
      background: #f8f9fa;
      border-radius: 12px;
      padding: 12px 20px;
      margin-bottom: 24px;
      font-size: 14px;
    }
    .breadcrumb a {
      color: #722F37;
      text-decoration: none;
      font-weight: 600;
    }
    .breadcrumb span { margin: 0 8px; color: #888; }
    .card {
      background: white;
      border-radius: 16px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
      padding: 24px;
      margin-bottom: 24px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
    }
    input, select {
      width: 100%;
      padding: 12px;
      border: 2px solid #eaeaea;
      border-radius: 12px;
      font-size: 16px;
    }
    .btn {
      background: #722F37;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-right: 10px;
      margin-top: 10px;
    }
    .btn:hover {
      background: #5e262d;
      transform: translateY(-2px);
    }
    .btn-outline {
      background: transparent;
      border: 2px solid #722F37;
      color: #722F37;
    }
    .btn-outline:hover {
      background: #fdf7f7;
    }
    .results { margin-top: 24px; }
    .ficha {
      background: #fdf7f7;
      border-left: 4px solid #722F37;
      padding: 20px;
      border-radius: 0 12px 12px 0;
      margin-top: 16px;
      position: relative;
    }
    .ficha h3 {
      margin-bottom: 16px;
      color: #722F37;
      font-size: 18px;
    }
    .ficha-row {
      display: flex;
      margin-bottom: 8px;
      font-size: 15px;
    }
    .ficha-label {
      width: 200px;
      font-weight: 600;
      color: #555;
    }
    .ficha-value {
      flex: 1;
      word-break: break-word;
    }
    .estatus-activo { background: #e8f5e9; color: #2e7d32; padding: 4px 12px; border-radius: 20px; font-weight: 600; }
    .estatus-suspendido { background: #fff3e0; color: #ef6c00; padding: 4px 12px; border-radius: 20px; font-weight: 600; }
    .estatus-destituido { background: #ffebee; color: #c62828; padding: 4px 12px; border-radius: 20px; font-weight: 600; }
    .photo-placeholder {
      width: 120px;
      height: 120px;
      background: #eee;
      border-radius: 8px;
      margin: 0 auto 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #777;
    }
    .actions-bar {
      margin-top: 20px;
      display: flex;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="breadcrumb">
      <a href="../../index.html">Inicio</a> <span>›</span>
      <a href="../index.html">RRHH</a> <span>›</span>
      <strong>Consulta</strong>
    </div>
    <div class="header">
      <img src="https://raw.githubusercontent.com/icapnacional/sistema-expedientes/main/Logo.png" alt="ICAP Nacional - PNB">
      <h1>Relación de Personal de la ICAP Nacional</h1>
    </div>
    <div class="card">
      <h2>🔍 Consulta de Personal</h2>
      <div class="form-group">
        <label for="searchInput">Buscar por Cédula o Nombre</label>
        <input type="text" id="searchInput" placeholder="Ej: V-12345678 o Juan Pérez">
      </div>
      <button class="btn" id="searchBtn">Buscar</button>
      <button class="btn btn-outline" id="clearBtn">Limpiar</button>

      <div class="results" id="results">
        <!-- Resultado aquí -->
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://xvqcgdbdwrocfcdfqpxv.supabase.co';
    const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh2cWNnZGJkd3JvY2ZjZGZxcHh2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjUwMjk4MjAsImV4cCI6MjA4MDYwNTgyMH0.Xjh4Dvq9A9lQKVPUv95i0MKikspYLPoNLm_6qFgYxmw';
    const client = supabase.createClient(SUPABASE_URL, ANON_KEY);

    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const { data: { session } } = await client.auth.getSession();
        if (!session) return window.location.href = '../../index.html';

        const { data: perfil } = await client
          .from('perfiles')
          .select('rol')
          .eq('id', session.user.id)
          .single();
        const userRol = perfil?.rol || 'consultor';

        if (!['admin', 'moderador', 'consultor'].includes(userRol)) {
          alert('🔒 Acceso denegado');
          window.location.href = '../../index.html';
          return;
        }

        document.getElementById('searchBtn').addEventListener('click', buscar);
        document.getElementById('clearBtn').addEventListener('click', () => {
          document.getElementById('searchInput').value = '';
          document.getElementById('results').innerHTML = '';
        });
        document.getElementById('searchInput').addEventListener('keypress', (e) => {
          if (e.key === 'Enter') buscar();
        });

      } catch (e) {
        console.error(e);
        window.location.href = '../../index.html';
      }
    });

    async function buscar() {
      const query = document.getElementById('searchInput').value.trim();
      const resultsDiv = document.getElementById('results');
      if (!query) {
        resultsDiv.innerHTML = '<p style="color:#666;">🔍 Ingrese un término de búsqueda.</p>';
        return;
      }

      try {
        let response;
        if (/^\d{7,8}$/.test(query)) {
          response = await client.from('rrhh_icap').select('*').eq('cedula', query);
        } else {
          response = await client.from('rrhh_icap').select('*')
            .ilike('nombre_apellidos', `%${query}%`);
        }

        if (response.error) throw response.error;
        if (response.data.length === 0) {
          resultsDiv.innerHTML = '<p style="color:#666;">🔍 No se encontraron resultados.</p>';
          return;
        }

        const item = response.data[0];
        const estatusClass = 
          item.estatus === 'activo' ? 'estatus-activo' :
          item.estatus === 'suspendido' ? 'estatus-suspendido' :
          item.estatus === 'destituido' ? 'estatus-destituido' : '';

        resultsDiv.innerHTML = `
          <div class="ficha">
            <div style="text-align:center; margin-bottom:20px;">
              <div class="photo-placeholder">📸 Foto</div>
              <h3>${item.nombre_apellidos || '—'}</h3>
            </div>
            <div class="ficha-row"><span class="ficha-label">RANGO:</span> <span class="ficha-value">${item.rango || '—'}</span></div>
            <div class="ficha-row"><span class="ficha-label">C.I.:</span> <span class="ficha-value">${item.cedula || '—'}</span></div>
            <div class="ficha-row"><span class="ficha-label">SEXO:</span> <span class="ficha-value">${item.sexo || '—'}</span></div>
            <div class="ficha-row"><span class="ficha-label">REGIÓN:</span> <span class="ficha-value">${item.region || '—'}</span></div>
            <div class="ficha-row"><span class="ficha-label">ESTADO:</span> <span class="ficha-value">${item.estado || '—'}</span></div>
            <div class="ficha-row"><span class="ficha-label">DIRECCIÓN:</span> <span class="ficha-value">${item.direccion || '—'}</span></div>
            <div class="ficha-row"><span class="ficha-label">CARGO:</span> <span class="ficha-value">${item.cargo || '—'}</span></div>
            <div class="ficha-row"><span class="ficha-label">ESTATUS:</span> <span class="ficha-value"><span class="${estatusClass}">${item.estatus || '—'}</span></span></div>
          </div>
          <div class="actions-bar">
            <button class="btn" onclick="generarPDF(${item.id})">📄 Exportar PDF</button>
            <button class="btn btn-outline" onclick="descargarFoto('${item.cedula}')">📷 Descargar Foto</button>
          </div>
        `;

        // Registrar log de consulta
        await client.from('logs_consultas').insert([{
          usuario_id: (await client.auth.getSession()).data.session.user.id,
          cedula_consultada: item.cedula,
          modulo: 'rrhh_icap',
          created_at: new Date().toISOString()
        }]);

      } catch (e) {
        console.error(e);
        resultsDiv.innerHTML = `<p style="color:#c62828;">❌ Error: ${e.message}</p>`;
      }
    }

    function generarPDF(id) {
      alert('📄 Función de exportar PDF en desarrollo.\nPuedes integrar jsPDF aquí.');
    }

    function descargarFoto(cedula) {
      alert(`📷 Foto no disponible aún.\nSimulación para cédula: ${cedula}`);
    }
  </script>
</body>
</html>
