      font-weight: 600;
      color: #333;
    }
    input, textarea {

      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
      background: #fdfdfd;
    }
    .btn {

    .btn-outline {

      font-size: 14px;
      color: #555;
    }
    .breadcrumb a { color: #722F37; text-decoration: none; font-weight: 600; }
    .breadcrumb span { margin: 0 8px; color: #888; }
    /* Ficha */
    .ficha {
      background: #fdf7f7;
      border-left: 4px solid #722F37;
      padding: 20px;
      border-radius: 0 12px 12px 0;
      margin-top: 16px;
      position: relative;
    }
    .ficha h3 {
      margin-bottom: 16px;
      color: #722F37;
      font-size: 18px;
    }
    .ficha-row {
      display: flex;
      margin-bottom: 8px;
      font-size: 15px;
    }
    .ficha-label {
      width: 200px;
      font-weight: 600;
      color: #555;
    }
    .ficha-value {
      flex: 1;
      word-break: break-word;
    }
    .btn-doc {
      background: #1976d2;
      color: white;
      margin-top: 8px;
    }
    .btn-doc:hover {
      background: #1565c0;
    }
    .doc-preview {
      margin-top: 16px;
      padding: 12px;
      background: #f0f0f0;
      border-radius: 8px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="breadcrumb">

      <strong>Fichas Disciplinarias</strong>

    <div class="header">

      <div class="form-group">
        <label for="observaciones">Observaciones</label>
        <textarea id="observaciones" rows="3" placeholder="Motivo de la ficha, resumen del caso, etc."></textarea>
      </div>
      <div class="form-group">
        <label for="documentoInput">Documento (PDF, JPG, PNG)</label>
        <input type="file" id="documentoInput" accept=".pdf,.jpg,.jpeg,.png" required>
      </div>
      <button id="btnSubirFicha" class="btn">📤 Subir Ficha</button>
      <div id="alertMessage" class="alert"></div>
    </div>
    <div class="card">
      <h2>🔍 Buscar Ficha por Cédula</h2>
      <div class="form-group">
        <input type="text" id="searchCedula" placeholder="Buscar por cédula">
      </div>
      <button id="btnBuscarFicha" class="btn">Buscar</button>
      <div id="resultsFicha" style="margin-top:20px;"></div>
    </div>
  </div>
