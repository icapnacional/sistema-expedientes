<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fichas Disciplinarias | RRHH ICAP</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #fafafa;
      font-family: 'Inter', sans-serif;
      color: #2d2d2d;
      padding: 20px;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
    }
    .header {
      text-align: center;
      margin-bottom: 24px;
    }
    .header img {
      width: 90px;
      margin-bottom: 16px;
    }
    .header h1 {
      font-size: 24px;
      font-weight: 700;
      color: #2d2d2d;
    }
    .header .subtitle {
      font-size: 16px;
      color: #722F37;
      font-weight: 600;
    }
    .user-info {
      background: white;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 24px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
      border: 1px solid #eee;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      margin-bottom: 24px;
      border: 1px solid #eee;
    }
    .card h2 {
      font-size: 20px;
      margin-bottom: 20px;
      color: #722F37;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      font-weight: 600;
      color: #333;
    }
    input, textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
      background: #fdfdfd;
    }
    .btn {
      background-color: #722F37;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:hover {
      background-color: #5e262d;
    }
    .btn-outline {
      background: transparent;
      border: 1px solid #722F37;
      color: #722F37;
    }
    .alert {
      padding: 12px;
      border-radius: 8px;
      margin: 16px 0;
      display: none;
    }
    .alert-success { background: #e8f5e9; color: #2e7d32; }
    .alert-error { background: #ffebee; color: #c62828; }
    .breadcrumb {
      background: #f8f9fa;
      border-radius: 12px;
      padding: 12px 20px;
      margin-bottom: 24px;
      font-size: 14px;
      color: #555;
    }
    .breadcrumb a { color: #722F37; text-decoration: none; font-weight: 600; }
    .breadcrumb span { margin: 0 8px; color: #888; }
    /* Ficha */
    .ficha {
      background: #fdf7f7;
      border-left: 4px solid #722F37;
      padding: 20px;
      border-radius: 0 12px 12px 0;
      margin-top: 16px;
      position: relative;
    }
    .ficha h3 {
      margin-bottom: 16px;
      color: #722F37;
      font-size: 18px;
    }
    .ficha-row {
      display: flex;
      margin-bottom: 8px;
      font-size: 15px;
    }
    .ficha-label {
      width: 200px;
      font-weight: 600;
      color: #555;
    }
    .ficha-value {
      flex: 1;
      word-break: break-word;
    }
    .btn-doc {
      background: #1976d2;
      color: white;
      margin-top: 8px;
    }
    .btn-doc:hover {
      background: #1565c0;
    }
    .doc-preview {
      margin-top: 16px;
      padding: 12px;
      background: #f0f0f0;
      border-radius: 8px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="breadcrumb">
      <a href="../../index.html">Inicio</a> <span>›</span>
      <a href="../index.html">RRHH</a> <span>›</span>
      <strong>Fichas Disciplinarias</strong>
    </div>
    <div class="header">
      <img src="https://raw.githubusercontent.com/icapnacional/sistema-expedientes/main/Logo.png" alt="ICAP Nacional - PNB" />
      <h1>Inspectable para el Control de la Actuación Policial</h1>
      <div class="subtitle">• Fichas Disciplinarias — RRHH ICAP •</div>
    </div>
    <div class="user-info">
      <strong>Usuario:</strong> <span id="userEmail">—</span> |
      <strong>Rol:</strong> <span id="userRol">—</span>
    </div>
    <div class="card">
      <h2>📄 Cargar Ficha Disciplinaria</h2>
      <div class="form-group">
        <label for="cedula">Cédula *</label>
        <input type="text" id="cedula" inputmode="numeric" maxlength="8" pattern="\d{8}" placeholder="Ej: 25275015">
      </div>
      <div class="form-group">
        <label for="observaciones">Observaciones</label>
        <textarea id="observaciones" rows="3" placeholder="Motivo de la ficha, resumen del caso, etc."></textarea>
      </div>
      <div class="form-group">
        <label for="documentoInput">Documento (PDF, JPG, PNG)</label>
        <input type="file" id="documentoInput" accept=".pdf,.jpg,.jpeg,.png" required>
      </div>
      <button id="btnSubirFicha" class="btn">📤 Subir Ficha</button>
      <div id="alertMessage" class="alert"></div>
    </div>
    <div class="card">
      <h2>🔍 Buscar Ficha por Cédula</h2>
      <div class="form-group">
        <input type="text" id="searchCedula" placeholder="Buscar por cédula">
      </div>
      <button id="btnBuscarFicha" class="btn">Buscar</button>
      <div id="resultsFicha" style="margin-top:20px;"></div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://xvqcgdbdwrocfcdfqpxv.supabase.co';
    const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh2cWNnZGJkd3JvY2ZjZGZxcHh2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjUwMjk4MjAsImV4cCI6MjA4MDYwNTgyMH0.Xjh4Dvq9A9lQKVPUv95i0MKikspYLPoNLm_6qFgYxmw';
    const client = supabase.createClient(SUPABASE_URL, ANON_KEY);
    const alertDiv = document.getElementById('alertMessage');

    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const {  { session }, error } = await client.auth.getSession();
        if (error || !session) return window.location.href = '../../index.html';

        const {  perfil } = await client
          .from('perfiles')
          .select('email, rol')
          .eq('id', session.user.id)
          .single();

        if (!perfil || (perfil.rol !== 'admin' && perfil.rol !== 'moderador')) {
          alert('🔒 Solo RRHH autorizado puede gestionar fichas.');
          return window.location.href = '../index.html';
        }

        document.getElementById('userEmail').textContent = perfil.email;
        document.getElementById('userRol').textContent = 
          perfil.rol === 'admin' ? 'Administrador' : 'Moderador';

        document.getElementById('btnSubirFicha').addEventListener('click', subirFicha);
        document.getElementById('btnBuscarFicha').addEventListener('click', buscarFicha);
        document.getElementById('searchCedula').addEventListener('keypress', e => {
          if (e.key === 'Enter') buscarFicha();
        });
      } catch (err) {
        console.error(err);
        window.location.href = '../../index.html';
      }
    });

    async function subirFicha() {
      const cedula = document.getElementById('cedula').value.trim();
      const observaciones = document.getElementById('observaciones').value.trim();
      const fileInput = document.getElementById('documentoInput');
      const file = fileInput.files[0];

      if (!/^\d{8}$/.test(cedula)) {
        return showAlert('⚠️ Cédula debe tener 8 dígitos.', 'error');
      }
      if (!file) {
        return showAlert('⚠️ Debes seleccionar un documento.', 'error');
      }

      try {
        // Verificar que el funcionario existe en rrhh_icap
        const { data: funcionario, error: errFunc } = await client
          .from('rrhh_icap')
          .select('nombre_apellidos')
          .eq('cedula', cedula)
          .single();
        if (errFunc) throw new Error('Funcionario no encontrado.');

        // Subir documento a storage
        const ext = file.name.split('.').pop().toLowerCase();
        const fileName = `ficha_${cedula}_${Date.now()}.${ext}`;
        const { error: upErr } = await client.storage
          .from('fichas_disciplinarias')
          .upload(fileName, file, { upsert: true });
        if (upErr) throw upErr;

        // Obtener URL pública
        const { data: urlData } = await client.storage
          .from('fichas_disciplinarias')
          .createSignedUrl(fileName, 3600);
        const documento_url = urlData?.signedUrl;

        // Registrar en rrhh_fichas
        const { error: insertErr } = await client.from('rrhh_fichas').insert({
          cedula: cedula,
          nombre_apellidos: funcionario.nombre_apellidos,
          observaciones: observaciones,
          documento_url: documento_url
        });
        if (insertErr) throw insertErr;

        // ✅ Registrar log
        try {
          const {  { session } } = await client.auth.getSession();
          if (session) {
            const {  perfil } = await client
              .from('perfiles')
              .select('email, rol')
              .eq('id', session.user.id)
              .single();
            if (perfil) {
              await client.from('rrhh_logs').insert({
                user_id: session.user.id,
                email: perfil.email,
                rol: perfil.rol,
                accion: 'ficha_icap',
                cedula_afectada: cedula,
                nombre_afectado: funcionario.nombre_apellidos,
                detalles: { modulo: 'rrhh_icap', tipo: 'ficha_disciplinaria' }
              });
            }
          }
        } catch (logErr) {
          console.warn('Log no registrado:', logErr.message);
        }

        showAlert('✅ Ficha subida exitosamente.', 'success');
        document.getElementById('cedula').value = '';
        document.getElementById('observaciones').value = '';
        fileInput.value = '';
        setTimeout(() => location.reload(), 1500);

      } catch (err) {
        console.error('❌ Error al subir ficha:', err);
        showAlert(`❌ Error: ${err.message}`, 'error');
      }
    }

    async function buscarFicha() {
      const query = document.getElementById('searchCedula').value.trim();
      if (!query) {
        return showAlert('⚠️ Ingresa una cédula para buscar.', 'error');
      }

      try {
        const { data, error } = await client
          .from('rrhh_fichas')
          .select('*')
          .ilike('cedula', `%${query}%`)
          .order('created_at', { ascending: false });

        if (error) throw error;

        const resultsDiv = document.getElementById('resultsFicha');
        if (data.length === 0) {
          resultsDiv.innerHTML = '<p style="color:#666;">🔍 No se encontraron fichas.</p>';
          return;
        }

        resultsDiv.innerHTML = data.map(f => `
          <div class="ficha">
            <h3>Ficha Disciplinaria — ${f.cedula}</h3>
            <div class="ficha-row"><span class="ficha-label">Nombre:</span> <span class="ficha-value">${f.nombre_apellidos || '—'}</span></div>
            <div class="ficha-row"><span class="ficha-label">Fecha:</span> <span class="ficha-value">${new Date(f.created_at).toLocaleDateString()}</span></div>
            <div class="ficha-row"><span class="ficha-label">Observaciones:</span> <span class="ficha-value">${f.observaciones || '—'}</span></div>
            <div class="ficha-row">
              <span class="ficha-label">Documento:</span>
              <span class="ficha-value">
                <a href="${f.documento_url}" target="_blank" class="btn btn-doc" style="display:inline-block;">
                  📄 Ver Documento
                </a>
              </span>
            </div>
          </div>
        `).join('');

      } catch (err) {
        console.error('❌ Error al buscar ficha:', err);
        document.getElementById('resultsFicha').innerHTML = `<p style="color:#c62828;">❌ Error: ${err.message}</p>`;
      }
    }

    function showAlert(msg, type) {
      alertDiv.textContent = msg;
      alertDiv.className = 'alert ' + (type === 'success' ? 'alert-success' : 'alert-error');
      alertDiv.style.display = 'block';
    }
  </script>
</body>
</html>
