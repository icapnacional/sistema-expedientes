<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Modificar Personal ICAP | RRHH</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #fafafa;
      font-family: 'Inter', sans-serif;
      color: #2d2d2d;
      padding: 20px;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
    }
    .header {
      text-align: center;
      margin-bottom: 24px;
    }
    .header img {
      width: 90px;
      margin-bottom: 16px;
    }
    .header h1 {
      font-size: 24px;
      font-weight: 700;
      color: #2d2d2d;
    }
    .header .subtitle {
      font-size: 16px;
      color: #722F37;
      font-weight: 600;
    }
    .user-info {
      background: white;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 24px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
      border: 1px solid #eee;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      margin-bottom: 24px;
      border: 1px solid #eee;
    }
    .card h2 {
      font-size: 20px;
      margin-bottom: 20px;
      color: #722F37;
    }
    .search-section {
      background: #f8f9fa;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 24px;
      border: 1px solid #eee;
    }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      font-weight: 600;
      color: #333;
    }
    input, select, textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
      background: #fdfdfd;
    }
    textarea.autoresize {
      resize: none;
      overflow: hidden;
      min-height: 44px;
      line-height: 1.5;
      padding: 10px 12px;
    }
    .btn {
      background-color: #722F37;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:hover {
      background-color: #5e262d;
    }
    .btn-outline {
      background: transparent;
      border: 1px solid #722F37;
      color: #722F37;
    }
    .btn-update {
      background-color: #2e7d32;
    }
    .btn-update:hover {
      background-color: #1b5e20;
    }
    .alert {
      padding: 12px;
      border-radius: 8px;
      margin: 16px 0;
      display: none;
    }
    .alert-success { background: #e8f5e9; color: #2e7d32; }
    .alert-error { background: #ffebee; color: #c62828; }
    .breadcrumb {
      background: #f8f9fa;
      border-radius: 12px;
      padding: 12px 20px;
      margin-bottom: 24px;
      font-size: 14px;
      color: #555;
    }
    .breadcrumb a { color: #722F37; text-decoration: none; font-weight: 600; }
    .breadcrumb span { margin: 0 8px; color: #888; }
    .photo-placeholder {
      width: 200px;
      height: 200px;
      border-radius: 8px;
      background: #f0f0f0;
      margin: 0 auto 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 64px;
      color: #888;
      overflow: hidden;
      border: 2px solid #eee;
    }
    .photo-placeholder img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    #photoInput { display: none; }
    .upload-btn {
      background: #722F37;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      margin-top: 8px;
    }
    .upload-btn:hover { background: #5e262d; }
    .status-indicator {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 13px;
      margin-left: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="breadcrumb">
      <a href="../../index.html">Inicio</a> <span>›</span>
      <a href="../index.html">RRHH</a> <span>›</span>
      <a href="#rrhh-icap">RRHH ICAP</a> <span>›</span>
      <strong>Modificar</strong>
    </div>
    <div class="header">
      <img src="https://raw.githubusercontent.com/icapnacional/sistema-expedientes/main/Logo.png" alt="ICAP Nacional - PNB" />
      <h1>Inspectable para el Control de la Actuación Policial</h1>
      <div class="subtitle">• Modificación de Personal ICAP •</div>
    </div>
    <div class="user-info">
      <strong>Usuario:</strong> <span id="userEmail">—</span> |
      <strong>Rol:</strong> <span id="userRol">—</span>
    </div>
    <div class="card">
      <h2>🔍 Buscar Personal por Cédula</h2>
      <div class="search-section">
        <div class="form-group">
          <label for="searchCedula">Cédula (8 dígitos) *</label>
          <input type="text" id="searchCedula" inputmode="numeric" maxlength="8" placeholder="Ej: 25275015">
        </div>
        <button id="btnBuscar" class="btn" style="width:100%;">Buscar</button>
        <div id="searchMessage" class="alert" style="margin-top:12px;"></div>
      </div>
      <form id="modificarForm" style="display:none;">
        <h2>✏️ Modificar Ficha de Personal ICAP</h2>
        <div id="fichaHeader" style="margin-bottom:16px; padding:12px; background:#f9f7f7; border-radius:8px;">
          <strong>C.I. <span id="headerCedula">—</span></strong> • 
          <span id="headerNombre">—</span>
          <span id="headerStatus" class="status-indicator" style="background:#ccc;"></span>
        </div>
        <div style="text-align:center; margin-bottom:24px;">
          <div class="photo-placeholder" id="photoContainer">🪪</div>
          <input type="file" id="photoInput" accept="image/*">
          <button type="button" class="upload-btn" onclick="document.getElementById('photoInput').click()">
            📷 Cambiar Foto (opcional)
          </button>
        </div>
        <div class="form-grid">
          <div class="form-group">
            <label for="rango">RANGO *</label>
            <select id="rango" required>
              <option value="">—</option>
              <option value="comisario mayor">Comisario Mayor</option>
              <option value="inspector jefe">Inspector Jefe</option>
              <option value="primer inspector">Primer Inspector</option>
              <option value="inspector">Inspector</option>
              <option value="oficial jefe">Oficial Jefe</option>
              <option value="primer oficial">Primer Oficial</option>
              <option value="oficial">Oficial</option>
              <option value="agente">Agente</option>
              <option value="administrativo">Administrativo</option>
            </select>
          </div>
          <div class="form-group">
            <label for="nombre_apellidos">NOMBRE Y APELLIDOS *</label>
            <textarea id="nombre_apellidos" class="autoresize" rows="1" required></textarea>
          </div>
          <div class="form-group">
            <label for="cedula">C.I. *</label>
            <input type="text" id="cedula" readonly>
          </div>
          <div class="form-group">
            <label for="sexo">SEXO *</label>
            <select id="sexo" required>
              <option value="">—</option>
              <option value="masculino">Masculino</option>
              <option value="femenino">Femenino</option>
            </select>
          </div>
          <div class="form-group">
            <label for="region">REGIÓN *</label>
            <select id="region" required>
              <option value="">—</option>
              <option value="guayana">Guayana</option>
              <option value="oriental">Oriental</option>
              <option value="los llanos">Los Llanos</option>
              <option value="capital">Capital</option>
              <option value="occidental">Occidental</option>
              <option value="los andes">Los Andes</option>
              <option value="insular">Insular</option>
              <option value="central">Central</option>
            </select>
          </div>
          <div class="form-group">
            <label for="estado">ESTADO *</label>
            <input type="text" id="estado" required>
          </div>
          <div class="form-group">
            <label for="direccion">DIRECCIÓN</label>
            <textarea id="direccion" class="autoresize" rows="1"></textarea>
          </div>
          <div class="form-group">
            <label for="cargo">CARGO</label>
            <input type="text" id="cargo">
          </div>
          <div class="form-group">
            <label for="estatus">ESTATUS *</label>
            <select id="estatus" required>
              <option value="">—</option>
              <option value="DISPONIBLE">DISPONIBLE</option>
              <option value="ABANDONO DE CARGO">ABANDONO DE CARGO</option>
              <option value="REPOSOS MEDICO">REPOSOS MEDICO</option>
              <option value="PROCESO DE RENUNCIA">PROCESO DE RENUNCIA</option>
              <option value="VACIONES">VACIONES</option>
              <option value="BAJA EN PROCESO">BAJA EN PROCESO</option>
              <option value="SUSPENDIDO">SUSPENDIDO</option>
              <option value="PRIVADO DE LIBERTAD">PRIVADO DE LIBERTAD</option>
              <option value="DESTITUIDO">DESTITUIDO</option>
              <option value="RENUNCIA">RENUNCIA</option>
              <option value="CONDUCTOR GENERAL">CONDUCTOR GENERAL</option>
              <option value="PROVIDENCIA">PROVIDENCIA</option>
            </select>
          </div>
        </div>
        <div style="text-align:right; margin-top:20px;">
          <button type="button" class="btn btn-outline" onclick="history.back()">← Cancelar</button>
          <button type="submit" class="btn btn-update">💾 Actualizar</button>
        </div>
      </form>
    </div>
  </div>
  <script>
    // ✅ Autoresize para textareas
    document.querySelectorAll('textarea.autoresize').forEach(el => {
      const adjust = () => {
        el.style.height = 'auto';
        el.style.height = (el.scrollHeight) + 'px';
      };
      el.addEventListener('input', adjust);
      adjust();
    });

    const SUPABASE_URL = 'https://xvqcgdbdwrocfcdfqpxv.supabase.co';
    const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh2cWNnZGJkd3JvY2ZjZGZxcHh2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjUwMjk4MjAsImV4cCI6MjA4MDYwNTgyMH0.Xjh4Dvq9A9lQKVPUv95i0MKikspYLPoNLm_6qFgYxmw';
    const client = supabase.createClient(SUPABASE_URL, ANON_KEY);
    const alertDiv = document.getElementById('searchMessage');
    let currentCedula = null;

    async function registrarLogEdicion(cedula, nombre) {
      try {
        const sessionRes = await client.auth.getSession();
        const session = sessionRes?.data?.session;
        if (!session) return;
        const perfilRes = await client
          .from('perfiles')
          .select('email, rol')
          .eq('id', session.user.id)
          .single();
        const perfil = perfilRes?.data;
        if (!perfil) return;
        await client.from('rrhh_logs').insert({
          user_id: session.user.id,
          email: perfil.email,
          rol: perfil.rol,
          accion: 'edicion',
          cedula_afectada: cedula,
          nombre_afectado: nombre,
          detalles: { modulo: 'rrhh_icap' }
        });
      } catch (err) {
        console.warn('⚠️ Log de edición no guardado:', err.message);
      }
    }

    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const sessionRes = await client.auth.getSession();
        const session = sessionRes?.data?.session;
        if (!session) return window.location.href = '../../index.html';
        const perfilRes = await client
          .from('perfiles')
          .select('email, rol')
          .eq('id', session.user.id)
          .single();
        const perfil = perfilRes?.data;
        if (!perfil || (perfil.rol !== 'admin' && perfil.rol !== 'moderador')) {
          alert('🔒 Solo RRHH autorizado puede modificar.');
          return window.location.href = '../index.html';
        }
        document.getElementById('userEmail').textContent = perfil.email;
        document.getElementById('userRol').textContent = 
          perfil.rol === 'admin' ? 'Administrador' : 'Moderador';

        document.getElementById('btnBuscar').addEventListener('click', buscarPorCedula);
        document.getElementById('searchCedula').addEventListener('keypress', e => {
          if (e.key === 'Enter') buscarPorCedula();
        });
        document.getElementById('modificarForm').addEventListener('submit', actualizarRegistro);
        document.getElementById('photoInput').addEventListener('change', previsualizarFoto);
      } catch (err) {
        console.error(err);
        window.location.href = '../../index.html';
      }
    });

    async function buscarPorCedula() {
      const cedula = document.getElementById('searchCedula').value.trim();
      if (!/^\d{8}$/.test(cedula)) {
        showAlert('⚠️ Cédula debe tener 8 dígitos.', 'error');
        return;
      }
      showAlert('', '');
      try {
        const { data, error } = await client
          .from('rrhh_icap')
          .select('*')
          .eq('cedula', cedula)
          .single();
        if (error || !data) throw new Error('No encontrado');
        cargarDatosFormulario(data);
        document.getElementById('modificarForm').style.display = 'block';
      } catch (err) {
        showAlert('❌ Cédula no encontrada.', 'error');
      }
    }

  function cargarDatosFormulario(f) {
  currentCedula = f.cedula;
  document.getElementById('headerCedula').textContent = f.cedula;
  document.getElementById('headerNombre').textContent = f.nombre_apellidos || '—';
  
  // ✅ Estatus coloreado
  const statusEl = document.getElementById('headerStatus');
  const estatusValue = (f.estatus || '').trim();
  statusEl.textContent = estatusValue || '—';
  let bgColor = '#9e9e9e';
  if (estatusValue === 'DISPONIBLE') bgColor = '#2e7d32';
  else if (estatusValue === 'SUSPENDIDO') bgColor = '#ef6c00';
  else if (estatusValue === 'DESTITUIDO') bgColor = '#c62828';
  else if (estatusValue === 'ABANDONO DE CARGO') bgColor = '#d32f2f';
  else if (estatusValue === 'REPOSOS MEDICO') bgColor = '#1976d2';
  else if (estatusValue === 'VACIONES') bgColor = '#fbc02d';
  else if (estatusValue === 'PRIVADO DE LIBERTAD') bgColor = '#7b1fa2';
  else if (estatusValue === 'RENUNCIA') bgColor = '#5d4037';
  statusEl.style.backgroundColor = bgColor;
  statusEl.style.color = '#fff';

  // ✅ Campos de texto
  document.getElementById('nombre_apellidos').value = f.nombre_apellidos || '';
  document.getElementById('cedula').value = f.cedula || '';
  document.getElementById('sexo').value = f.sexo || '';
  document.getElementById('estado').value = f.estado || '';
  document.getElementById('direccion').value = f.direccion || '';
  document.getElementById('cargo').value = f.cargo || '';

  // ✅ Campos SELECT: normalizar valor antes de asignar
  const rangoValue = (f.rango || '').trim().toLowerCase();
  const regionValue = (f.region || '').trim().toLowerCase();

  // Asignar solo si el valor existe y coincide con alguna opción
  const rangoSelect = document.getElementById('rango');
  const regionSelect = document.getElementById('region');

  // Buscar opción exacta (por valor)
  if (rangoSelect.querySelector(`option[value="${rangoValue}"]`)) {
    rangoSelect.value = rangoValue;
  } else {
    rangoSelect.value = ''; // opción por defecto
  }

  if (regionSelect.querySelector(`option[value="${regionValue}"]`)) {
    regionSelect.value = regionValue;
  } else {
    regionSelect.value = '';
  }

  // ✅ Estatus
  document.getElementById('estatus').value = f.estatus || '';

  // ✅ Foto
  cargarFotoActual(f.cedula);

  // ✅ Ajustar textareas
  document.querySelectorAll('textarea.autoresize').forEach(el => {
    el.style.height = 'auto';
    el.style.height = el.scrollHeight + 'px';
  });
}
    // ✅ Cargar foto desde Supabase Storage
    async function cargarFotoActual(cedula) {
      const container = document.getElementById('photoContainer');
      container.innerHTML = '🪪';
      const extensions = ['jpeg', 'jpg', 'png'];
      for (const ext of extensions) {
        const path = `foto_${cedula}.${ext}`;
        try {
          const { data, error } = await client.storage
            .from('fotos_funcionarios')
            .createSignedUrl(path, 3600);
          if (error) continue;
          if (data?.signedUrl) {
            const img = new Image();
            img.crossOrigin = 'anonymous';
            img.onload = () => {
              container.innerHTML = '';
              container.appendChild(img);
            };
            img.src = data.signedUrl;
            return;
          }
        } catch (err) {
          continue;
        }
      }
    }

    function previsualizarFoto(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.src = ev.target.result;
        img.onload = () => {
          document.getElementById('photoContainer').innerHTML = '';
          document.getElementById('photoContainer').appendChild(img);
        };
      };
      reader.readAsDataURL(file);
    }

    async function actualizarRegistro(e) {
      e.preventDefault();
      if (!currentCedula) return;

      const data = {
        rango: document.getElementById('rango').value,
        nombre_apellidos: document.getElementById('nombre_apellidos').value.trim(),
        sexo: document.getElementById('sexo').value,
        region: document.getElementById('region').value,
        estado: document.getElementById('estado').value.trim(),
        direccion: document.getElementById('direccion').value.trim(),
        cargo: document.getElementById('cargo').value.trim(),
        estatus: document.getElementById('estatus').value
      };

      const required = ['rango', 'nombre_apellidos', 'sexo', 'region', 'estado', 'estatus'];
      for (let field of required) {
        if (!data[field]) {
          showAlert(`⚠️ El campo "${field}" es obligatorio.`, 'error');
          return;
        }
      }

      try {
        const { error } = await client
          .from('rrhh_icap')
          .update(data)
          .eq('cedula', currentCedula);
        if (error) throw error;

        // Subir nueva foto si se seleccionó
        const photoInput = document.getElementById('photoInput');
        if (photoInput.files.length > 0) {
          const file = photoInput.files[0];
          const ext = file.name.split('.').pop().toLowerCase();
          const fileName = `foto_${currentCedula}.${ext}`;
          const { error: upErr } = await client.storage
            .from('fotos_funcionarios')
            .upload(fileName, file, { upsert: true });
          if (upErr) console.warn('Foto subida con advertencia:', upErr.message);
        }

        await registrarLogEdicion(currentCedula, data.nombre_apellidos);
        showAlert('✅ Ficha actualizada exitosamente.', 'success');
        setTimeout(() => location.reload(), 1500);
      } catch (err) {
        console.error('Error al actualizar:', err);
        showAlert(`❌ Error: ${err.message || 'verifique los datos'}`, 'error');
      }
    }

    function showAlert(msg, type) {
      alertDiv.textContent = msg;
      alertDiv.className = 'alert ' + (type === 'success' ? 'alert-success' : 'alert-error');
      alertDiv.style.display = msg ? 'block' : 'none';
    }
  </script>
</body>
</html>
