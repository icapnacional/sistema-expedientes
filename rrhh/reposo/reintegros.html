<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reintegros - ICAP RRHH</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #fafafa;
      font-family: 'Inter', sans-serif;
      color: #2d2d2d;
      padding: 20px;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    .header {
      text-align: center;
      margin-bottom: 24px;
      padding: 20px 0;
    }
    .header img {
      width: 90px;
      margin-bottom: 16px;
    }
    .header h1 {
      font-size: 24px;
      font-weight: 700;
      color: #2d2d2d;
    }
    .header .subtitle {
      font-size: 16px;
      color: #722F37;
      font-weight: 600;
    }
    .user-info {
      background: white;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 24px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
      border: 1px solid #eee;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
      margin-bottom: 24px;
      border: 1px solid #eee;
    }
    .card h2 {
      font-size: 20px;
      margin-bottom: 20px;
      color: #722F37;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 16px;
    }
    th, td {
      padding: 12px 10px;
      text-align: left;
      border-bottom: 1px solid #eee;
    }
    th {
      background-color: #f8f9fa;
      font-weight: 600;
      color: #333;
    }
    tr.vencido {
      background-color: #ffebee;
    }
    .btn {
      background-color: #722F37;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:hover {
      background-color: #5e262d;
    }
    .btn-reintegrar {
      background-color: #c62828;
    }
    .btn-reintegrar:hover {
      background-color: #b71c1c;
    }
    .alert {
      padding: 12px;
      border-radius: 8px;
      margin: 16px 0;
      display: none;
    }
    .alert-success { background: #e8f5e9; color: #2e7d32; }
    .alert-error { background: #ffebee; color: #c62828; }
    .breadcrumb {
      background: #f8f9fa;
      border-radius: 12px;
      padding: 12px 20px;
      margin-bottom: 24px;
      font-size: 14px;
      color: #555;
    }
    .breadcrumb a { color: #722F37; text-decoration: none; font-weight: 600; }
    .breadcrumb span { margin: 0 8px; color: #888; }
  </style>
</head>
<body>
  <div class="container">
    <div class="breadcrumb">
      <a href="../../index.html">Inicio</a> <span>›</span>
      <a href="../index.html">RRHH</a> <span>›</span>
      <strong>Reintegros</strong>
    </div>
    <div class="header">
      <img src="https://raw.githubusercontent.com/icapnacional/sistema-expedientes/main/Logo.png" alt="ICAP Nacional - PNB" />
      <h1>Inspectable para el Control de la Actuación Policial</h1>
      <div class="subtitle">🔁 Gestión de Reintegros</div>
    </div>
    <div class="user-info">
      <strong>Usuario:</strong> <span id="userEmail">—</span> |
      <strong>Rol:</strong> <span id="userRol">—</span>
    </div>

    <div class="card">
      <h2>📋 Listado de Reposos Activos</h2>
      <div id="alertMessage" class="alert"></div>
      <div id="loading" style="text-align:center; padding:20px;">Cargando reposos...</div>
      <table id="repososTable" style="display:none;">
        <thead>
          <tr>
            <th>Cédula</th>
            <th>Nombre</th>
            <th>Estado</th>
            <th>Rango</th>
            <th>Inicio</th>
            <th>Fin</th>
            <th>Acción</th>
          </tr>
        </thead>
        <tbody id="repososBody"></tbody>
      </table>
    </div>

    <div style="text-align:center; margin-top:24px;">
      <a href="../index.html" class="btn" style="text-decoration:none; display:inline-block;">← Volver</a>
    </div>
  </div>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

    const SUPABASE_URL = 'https://xvqcgdbdwrocfcdfqpxv.supabase.co';
    const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh2cWNnZGJkd3JvY2ZjZGZxcHh2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjUwMjk4MjAsImV4cCI6MjA4MDYwNTgyMH0.Xjh4Dvq9A9lQKVPUv95i0MKikspYLPoNLm_6qFgYxmw';
    const client = createClient(SUPABASE_URL, ANON_KEY);

    const alertDiv = document.getElementById('alertMessage');
    const loadingEl = document.getElementById('loading');
    const tableEl = document.getElementById('repososTable');
    const tbody = document.getElementById('repososBody');

    function showAlert(msg, type) {
      alertDiv.textContent = msg;
      alertDiv.className = 'alert ' + (type === 'success' ? 'alert-success' : 'alert-error');
      alertDiv.style.display = 'block';
      setTimeout(() => alertDiv.style.display = 'none', 5000);
    }

    async function checkAccess() {
      try {
        const { data: { session }, error } = await client.auth.getSession();
        if (error || !session) return window.location.href = '../index.html';

        const { data: perfil, error: pErr } = await client
          .from('perfiles')
          .select('email, rol')
          .eq('id', session.user.id)
          .single();

        if (pErr || !perfil) return window.location.href = '../index.html';

        const allowed = ['admin', 'consultor'];
        if (!allowed.includes(perfil.rol)) {
          alert('🔒 Acceso restringido');
          return window.location.href = '../index.html';
        }

        document.getElementById('userEmail').textContent = perfil.email;
        document.getElementById('userRol').textContent =
          perfil.rol === 'admin' ? 'Administrador' : 'Consultor';

        loadReposos();
      } catch (err) {
        console.error(err);
        window.location.href = '../index.html';
      }
    }

    async function loadReposos() {
      try {
        // Cargar todos los reposos (no hay fecha_reintegro)
        const { data: reposos, error: rErr } = await client
          .from('reposos')
          .select('cedula, nombre, rango, region, estado, estatus, fecha_inicio, fecha_fin');

        if (rErr) throw rErr;

        if (!reposos || reposos.length === 0) {
          loadingEl.textContent = 'No hay reposos registrados.';
          return;
        }

        // Obtener datos de rrhh_icap para validar existencia
        const cedulas = reposos.map(r => r.cedula);
        const { data: personal, error: pErr } = await client
          .from('rrhh_icap')
          .select('cedula, nombres_apellidos, estado, rango, status')
          .in('cedula', cedulas);

        const personalMap = {};
        (personal || []).forEach(p => {
          personalMap[p.cedula] = p;
        });

        const today = new Date();
        tbody.innerHTML = '';
        reposos.forEach(repo => {
          const fin = repo.fecha_fin ? new Date(repo.fecha_fin) : null;
          const isVencido = fin && fin < today;

          const pers = personalMap[repo.cedula] || {
            nombres_apellidos: repo.nombre || '—',
            estado: repo.estado || '—',
            rango: repo.rango || '—'
          };

          const row = document.createElement('tr');
          if (isVencido) row.classList.add('vencido');

          row.innerHTML = `
            <td>${repo.cedula}</td>
            <td>${pers.nombres_apellidos}</td>
            <td>${pers.estado}</td>
            <td>${pers.rango}</td>
            <td>${repo.fecha_inicio ? new Date(repo.fecha_inicio).toLocaleDateString('es-VE') : '—'}</td>
            <td>${fin ? fin.toLocaleDateString('es-VE') : '—'}</td>
            <td>
              ${isVencido ? `<button class="btn btn-reintegrar" data-cedula="${repo.cedula}">Reintegrar</button>` : '—'}
            </td>
          `;
          tbody.appendChild(row);
        });

        loadingEl.style.display = 'none';
        tableEl.style.display = 'table';

        // Eventos botones
        document.querySelectorAll('.btn-reintegrar').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const cedula = e.target.dataset.cedula;
            reintegrar(cedula);
          });
        });

      } catch (err) {
        console.error('Error al cargar reposos:', err);
        loadingEl.textContent = '❌ Error al cargar los datos.';
      }
    }

    async function reintegrar(cedula) {
      if (!confirm(`¿Reintegrar al funcionario con cédula ${cedula}?`)) return;

      try {
       // 1. Actualizar estatus en rrhh_icap → "DISPONIBLE"
const { error: err1 } = await client
  .from('rrhh_icap')
  .update({ estatus: 'DISPONIBLE' })
  .eq('cedula', cedula);

        if (err1) throw new Error('No se pudo actualizar el status del funcionario.');

        // 2. Opcional: marcar reposo como reintegrado
        const { error: err2 } = await client
          .from('reposos')
          .update({ estatus: 'REINTEGRADO' })
          .eq('cedula', cedula)
          .eq('estatus', 'PROCESO DE RENUNCIA ');

        // No fallamos si err2 existe

        showAlert(`✅ Funcionario ${cedula} reintegrado exitosamente.`, 'success');
        loadReposos(); // Recargar lista

      } catch (err) {
        console.error(err);
        showAlert(`❌ Error: ${err.message}`, 'error');
      }
    }

    // Iniciar
    checkAccess();
  </script>
</body>
</html>
