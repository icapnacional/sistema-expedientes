<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin | ICAP Nacional - PNB</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: #f5f7fa;
      color: #2d2d2d;
      padding: 20px;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    .header {
      text-align: center;
      margin-bottom: 24px;
    }
    .header img {
      width: 80px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      color: #722F37;
    }
    .card {
      background: white;
      border-radius: 16px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
      padding: 32px;
      margin-bottom: 24px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #333;
    }
    input, select {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
    }
    select[multiple] {
      height: 180px;
    }
    .modules-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 8px;
    }
    .module-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .module-item input[type="checkbox"] {
      width: auto;
      margin: 0;
    }
    .btn {
      background: #722F37;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 12px 20px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-sm {
      padding: 8px 14px;
      font-size: 14px;
    }
    .btn:hover {
      background: #5e262d;
    }
    .btn-outline {
      background: transparent;
      border: 1px solid #722F37;
      color: #722F37;
    }
    .btn-outline:hover {
      background: #fdf7f7;
    }
    .btn-delete {
      background: #c00;
      color: white;
    }
    .btn-delete:hover {
      background: #a00;
    }
    .alert {
      padding: 12px;
      border-radius: 8px;
      margin: 16px 0;
      display: none;
    }
    .alert-success { background: #e6f7ee; color: #1a7f37; border: 1px solid #b7e8c7; }
    .alert-error { background: #fff5f5; color: #c00; border: 1px solid #ffd0d0; }
    .back-btn {
      background: #eee;
      color: #555;
    }
    .back-btn:hover {
      background: #ddd;
    }
    /* Tabla de usuarios */
    .table-responsive {
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 16px;
    }
    th, td {
      padding: 14px 12px;
      text-align: left;
      border-bottom: 1px solid #eee;
      font-size: 14px;
    }
    th {
      background: #fafafa;
      font-weight: 600;
      color: #333;
    }
    tr:hover td {
      background: #fcfcfc;
    }
    .rol-tag {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
    }
    .rol-admin { background: #ffebee; color: #c62828; }
    .rol-moderador { background: #e8f5e9; color: #2e7d32; }
    .rol-consultor { background: #e3f2fd; color: #1565c0; }
    /* Paginación */
    .pagination {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 20px;
    }
    .page-btn {
      width: 36px;
      height: 36px;
      border-radius: 6px;
      border: 1px solid #ddd;
      background: white;
      font-weight: 500;
      cursor: pointer;
    }
    .page-btn.active {
      background: #722F37;
      color: white;
      border-color: #722F37;
    }
    .page-btn:hover:not(.active) {
      background: #f5f5f5;
    }
    .flex-between {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <img src="https://raw.githubusercontent.com/icapnacional/sistema-expedientes/main/Logo.png" alt="ICAP">
      <h1>Panel de Administración — Gestión de Usuarios</h1>
    </div>
    <div class="card">
      <div class="flex-between">
        <h2>➕ Crear Nuevo Usuario</h2>
        <button class="btn back-btn" onclick="window.location.href='index.html'">← Volver al Panel</button>
      </div>
      <div id="alertMessage" class="alert"></div>
      <form id="createUserForm">
        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" required placeholder="ejemplo@pn.gob.ve">
        </div>
        <div class="form-group">
          <label for="password">Contraseña (mín. 8 caracteres)</label>
          <input type="password" id="password" required minlength="8">
        </div>
        <div class="form-group">
          <label for="rol_id">Rol (identificación visual)</label>
          <select id="rol_id" required>
            <option value="">-- Seleccionar --</option>
            <option value="1">Administrador</option>
            <option value="2">Moderador</option>
            <option value="3">Consultor</option>
          </select>
          <small style="display:block; margin-top:6px; color:#666;">ℹ️ El rol no define permisos. Asigne módulos manualmente.</small>
        </div>
        <div class="form-group">
          <label for="estados">Estados asignados (Ctrl/Cmd + clic)</label>
          <select id="estados" multiple required>
            <option value="Amazonas">Amazonas</option>
            <option value="Anzoátegui">Anzoátegui</option>
            <option value="Apure">Apure</option>
            <option value="Aragua">Aragua</option>
            <option value="Barinas">Barinas</option>
            <option value="Bolívar">Bolívar</option>
            <option value="Carabobo">Carabobo</option>
            <option value="Cojedes">Cojedes</option>
            <option value="Delta Amacuro">Delta Amacuro</option>
            <option value="Distrito Capital">Distrito Capital</option>
            <option value="Falcón">Falcón</option>
            <option value="Guárico">Guárico</option>
            <option value="Lara">Lara</option>
            <option value="Mérida">Mérida</option>
            <option value="Miranda">Miranda</option>
            <option value="Monagas">Monagas</option>
            <option value="Nueva Esparta">Nueva Esparta</option>
            <option value="Portuguesa">Portuguesa</option>
            <option value="Sucre">Sucre</option>
            <option value="Táchira">Táchira</option>
            <option value="Trujillo">Trujillo</option>
            <option value="Vargas">Vargas</option>
            <option value="Yaracuy">Yaracuy</option>
            <option value="Zulia">Zulia</option>
            <option value="Dependencias Federales">Dependencias Federales</option>
          </select>
        </div>
        <div class="form-group">
          <label>✅ Asignar módulos (botones visibles)</label>
          <div class="modules-grid" id="modulesCheckboxes"></div>
        </div>
        <button type="submit" class="btn">✅ Crear Usuario</button>
      </form>
    </div>
    <!-- Listado de usuarios -->
    <div class="card">
      <h2>👥 Usuarios Registrados (<span id="totalUsers">0</span>)</h2>
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>Correo</th>
              <th>Rol</th>
              <th>Estados</th>
              <th>Módulos</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="usersTableBody">
            <tr><td colspan="5" style="text-align:center">Cargando...</td></tr>
          </tbody>
        </table>
      </div>
      <div class="pagination" id="pagination"></div>
    </div>
  </div>

  <script>
    const MODULOS = {
      rh: "RH", analisis: "Análisis", logistica: "Logística",
      dppc: "DPPC", asesoria: "Asesoría", disciplinarios: "Disciplinarios",
      secretaria: "Secretaría", admin: "Admin"
    };
    const ROL_LABELS = { 1: "Administrador", 2: "Moderador", 3: "Consultor" };
    const ROL_COLORS = { 1: "rol-admin", 2: "rol-moderador", 3: "rol-consultor" };

    // 🧪 Mock data
    let usuarios = [
      {
        id: "u001",
        email: "admin@icap.gob.ve",
        rol_id: 1,
        estados_asignados: ["Distrito Capital", "Miranda"],
        modulos_asignados: ["rh", "admin", "dppc"]
      },
      {
        id: "u002",
        email: "moderador@pn.gob.ve",
        rol_id: 2,
        estados_asignados: ["Zulia", "Lara"],
        modulos_asignados: ["analisis", "logistica"]
      },
      {
        id: "u003",
        email: "consultor@pn.gob.ve",
        rol_id: 3,
        estados_asignados: ["Carabobo"],
        modulos_asignados: ["asesoria"]
      },
      {
        id: "u004",
        email: "rh@icap.gob.ve",
        rol_id: 2,
        estados_asignados: ["Aragua", "Carabobo", "Guárico"],
        modulos_asignados: ["rh"]
      },
      {
        id: "u005",
        email: "admin2@icap.gob.ve",
        rol_id: 1,
        estados_asignados: ["Trujillo", "Táchira"],
        modulos_asignados: ["admin", "secretaria"]
      },
      {
        id: "u006",
        email: "dppc@pn.gob.ve",
        rol_id: 2,
        estados_asignados: ["Vargas"],
        modulos_asignados: ["dppc"]
      },
      {
        id: "u007",
        email: "disc@icap.gob.ve",
        rol_id: 3,
        estados_asignados: ["Anzoátegui"],
        modulos_asignados: ["disciplinarios"]
      },
      {
        id: "u008",
        email: "analista@icap.gob.ve",
        rol_id: 2,
        estados_asignados: ["Monagas", "Sucre"],
        modulos_asignados: ["analisis", "logistica"]
      },
      {
        id: "u009",
        email: "asesor@pn.gob.ve",
        rol_id: 3,
        estados_asignados: ["Nueva Esparta"],
        modulos_asignados: ["asesoria"]
      },
      {
        id: "u010",
        email: "coordinador@icap.gob.ve",
        rol_id: 1,
        estados_asignados: ["Amazonas", "Bolívar"],
        modulos_asignados: ["admin", "rh", "dppc"]
      }
    ];

    const alertDiv = document.getElementById('alertMessage');
    const usersTableBody = document.getElementById('usersTableBody');
    const totalUsersSpan = document.getElementById('totalUsers');
    const paginationDiv = document.getElementById('pagination');
    let currentPage = 1;
    const perPage = 10;

    // Render checkboxes
    function renderModulesCheckboxes() {
      const container = document.getElementById('modulesCheckboxes');
      container.innerHTML = '';
      Object.entries(MODULOS).forEach(([id, label]) => {
        const div = document.createElement('div');
        div.className = 'module-item';
        div.innerHTML = `<input type="checkbox" id="mod_${id}" name="modulo" value="${id}"><label for="mod_${id}">${label}</label>`;
        container.appendChild(div);
      });
    }

    // Mostrar alerta
    function showAlert(msg, type) {
      alertDiv.textContent = msg;
      alertDiv.className = `alert alert-${type}`;
      alertDiv.style.display = 'block';
      if (type === 'success') {
        setTimeout(() => alertDiv.style.display = 'none', 5000);
      }
    }

    // Mock: simular checkAdmin (siempre true en mock)
    function checkAdmin() {
      return Promise.resolve(true);
    }

    // Cargar usuarios (mock)
    function loadUsers(page = 1) {
      currentPage = page;
      totalUsersSpan.textContent = usuarios.length;

      const from = (page - 1) * perPage;
      const to = from + perPage;
      const pageData = usuarios.slice(from, to);
      renderUsersTable(pageData);
      renderPagination(page, Math.ceil(usuarios.length / perPage));
    }

    function renderUsersTable(users) {
      if (users.length === 0) {
        usersTableBody.innerHTML = '<tr><td colspan="5" style="text-align:center">No hay usuarios registrados.</td></tr>';
        return;
      }
      usersTableBody.innerHTML = users.map(u => {
        const modulosTxt = u.modulos_asignados?.map(m => MODULOS[m] || m).join(', ') || '—';
        const estadosTxt = u.estados_asignados?.join(', ') || '—';
        const rolTag = `<span class="rol-tag ${ROL_COLORS[u.rol_id]}">${ROL_LABELS[u.rol_id]}</span>`;
        // Simular auto-protección: no permitir eliminar al primer usuario (admin)
        const canDelete = u.id !== 'u001'; 
        return `
          <tr>
            <td>${u.email}</td>
            <td>${rolTag}</td>
            <td title="${estadosTxt}">${estadosTxt.length > 30 ? estadosTxt.substring(0,27)+'...' : estadosTxt}</td>
            <td title="${modulosTxt}">${modulosTxt.length > 30 ? modulosTxt.substring(0,27)+'...' : modulosTxt}</td>
            <td>
              ${canDelete ? `<button class="btn btn-sm btn-delete" onclick="confirmDelete('${u.id}', '${u.email}')">🗑️ Eliminar</button>` : `<span style="color:#999">—</span>`}
            </td>
          </tr>
        `;
      }).join('');
    }

    function renderPagination(current, total) {
      paginationDiv.innerHTML = '';
      if (total <= 1) return;

      const range = 2;
      let start = Math.max(1, current - range);
      let end = Math.min(total, current + range);

      if (current > 1) {
        const btn = document.createElement('button');
        btn.className = 'page-btn';
        btn.textContent = '«';
        btn.onclick = () => loadUsers(current - 1);
        paginationDiv.appendChild(btn);
      }

      for (let i = start; i <= end; i++) {
        const btn = document.createElement('button');
        btn.className = `page-btn ${i === current ? 'active' : ''}`;
        btn.textContent = i;
        btn.onclick = () => loadUsers(i);
        paginationDiv.appendChild(btn);
      }

      if (current < total) {
        const btn = document.createElement('button');
        btn.className = 'page-btn';
        btn.textContent = '»';
        btn.onclick = () => loadUsers(current + 1);
        paginationDiv.appendChild(btn);
      }
    }

    function confirmDelete(userId, email) {
      if (!confirm(`⚠️ ¿Eliminar usuario ${email}?\nEsta acción es irreversible.`)) return;
      
      usuarios = usuarios.filter(u => u.id !== userId);
      showAlert(`✅ Usuario ${email} eliminado.`, 'success');
      loadUsers(currentPage);
    }

    function createUserLocal() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const rol_id = parseInt(document.getElementById('rol_id').value);
      const estados = Array.from(document.getElementById('estados').selectedOptions).map(o => o.value);
      const modulos = Array.from(document.querySelectorAll('input[name="modulo"]:checked')).map(cb => cb.value);

      if (!email || !password || !rol_id || !estados.length || !modulos.length) {
        return showAlert('Todos los campos son obligatorios.', 'error');
      }

      const nuevoId = 'u' + (usuarios.length + 1).toString().padStart(3, '0');
      usuarios.push({
        id: nuevoId,
        email,
        rol_id,
        estados_asignados: estados,
        modulos_asignados: modulos
      });

      showAlert(`✅ Usuario creado: ${email}`, 'success');
      document.getElementById('createUserForm').reset();
      document.querySelectorAll('input[name="modulo"]').forEach(cb => cb.checked = false);
      loadUsers(1);
    }

    document.getElementById('createUserForm')?.addEventListener('submit', (e) => {
      e.preventDefault();
      createUserLocal();
    });

    renderModulesCheckboxes();
    loadUsers();
  </script>
</body>
</html>
