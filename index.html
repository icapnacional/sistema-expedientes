<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ICAP Nacional - PNB</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #fafafa;
      font-family: 'Inter', sans-serif;
      color: #2d2d2d;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .login-card, .panel-card {
      background: white;
      border-radius: 16px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 500px;
      padding: 40px 32px;
      text-align: center;
      border: 1px solid #eee;
    }
    .logo { width: 90px; margin-bottom: 24px; }
    h1 { font-size: 24px; font-weight: 700; color: #2d2d2d; margin-bottom: 8px; }
    .subtitle { font-size: 15px; color: #555; margin-bottom: 28px; }
    .form-group { text-align: left; margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: 600; color: #333; }
    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
      color: #222;
    }
    .btn-login, .btn-logout {
      background-color: #722F37;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 16px;
      font-size: 16px;
      font-weight: 600;
      width: 100%;
      cursor: pointer;
      margin-top: 10px;
    }
    .user-info {
      margin: 24px 0;
      padding: 14px;
      background: #f9f9f9;
      border-radius: 10px;
      font-size: 14px;
      color: #333;
      border: 1px solid #eee;
    }
    .panel-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      margin: 24px 0;
    }
    @media (max-width: 600px) { .panel-buttons { grid-template-columns: 1fr; } }
    .panel-btn {
      background: white;
      border: 2px solid #eaeaea;
      border-radius: 14px;
      padding: 20px 12px;
      font-size: 15px;
      font-weight: 600;
      color: #722F37;
      cursor: pointer;
      min-height: 85px;
      text-align: center;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="loginView" class="login-card">
    <img src="https://raw.githubusercontent.com/icapnacional/sistema-expedientes/main/Logo.png" alt="ICAP" class="logo"/>
    <h1>Sistema de Expedientes</h1>
    <form id="loginForm">
      <div class="form-group">
        <label for="email">Correo</label>
        <input type="email" id="email" required placeholder="usuario@icap.gob.ve"/>
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" required placeholder="••••••••"/>
      </div>
      <button type="submit" class="btn-login">Iniciar Sesión</button>
    </form>
    <div id="alertMessage" class="alert" style="margin-top:18px;padding:12px;border-radius:8px;display:none;"></div>
  </div>

  <div id="panelView" class="panel-card hidden">
    <img src="https://raw.githubusercontent.com/icapnacional/sistema-expedientes/main/Logo.png" alt="ICAP" class="logo"/>
    <h1>Panel Principal</h1>
    <div class="user-info">
      <strong>Usuario:</strong> <span id="userEmail">—</span><br>
      <strong>Estado(s):</strong> <span id="userEstado">—</span>
    </div>
    <div id="panelButtonsContainer" class="panel-buttons">
      <!-- Dinámico -->
    </div>
    <button id="logoutBtn" class="btn-logout">Cerrar Sesión</button>
  </div>

  <script>
    const SUPABASE_URL = 'https://stwriaubepeugobgyxjt.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN0d3JpYXViZXBldWdvYmd5eGp0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTQ3NDU0MDUsImV4cCI6MjA3MDMyMTQwNX0.3Rorn10j19M2nmmv03oSEwm-O-y0bsywAA8_CRR2O1g';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const loginView = document.getElementById('loginView');
    const panelView = document.getElementById('panelView');
    const alertDiv = document.getElementById('alertMessage');
    const logoutBtn = document.getElementById('logoutBtn');

    const BOTONES = [
      { name: 'Recursos Humanos', icon: '🧑‍💼', href: 'rh.html' },
      { name: 'Análisis', icon: '🔍', href: 'analisis.html' },
      { name: 'Logística', icon: '📦', href: 'logistica.html' },
      { name: 'DPPC', icon: '🛡️', href: 'dppc.html' },
      { name: 'Asesoría Legal', icon: '⚖️', href: 'legal.html' },
      { name: 'D.E. Disciplinarios', icon: '📑', href: 'disciplinarios.html' },
      { name: 'Secretaría', icon: '📝', href: 'secretaria.html' }
    ];

    async function checkSession() {
      const { data: { session }, error: sessErr } = await supabase.auth.getSession();
      if (sessErr || !session) return showLogin();

      const { data: perfil, error } = await supabase
        .from('usuarios_perfil')
        .select('rol_id, estados_asignados')
        .eq('user_id', session.user.id)
        .single();

      if (error) {
        alertDiv.textContent = 'Error interno. Contacte al admin.';
        alertDiv.style.display = 'block';
        return showLogin();
      }

      if (!perfil) {
        alertDiv.textContent = 'Perfil no asignado.';
        alertDiv.style.display = 'block';
        return showLogin();
      }

      const estados = perfil.estados_asignados.join(', ') || '—';
      showPanel(session.user.email, estados, perfil.rol_id);
    }

    function showLogin() {
      loginView.classList.remove('hidden');
      panelView.classList.add('hidden');
    }

    function showPanel(email, estados, rol_id) {
      document.getElementById('userEmail').textContent = email;
      document.getElementById('userEstado').textContent = estados;

      let html = BOTONES.map(b => `
        <button class="panel-btn" onclick="location.href='${b.href}'">
          ${b.icon} ${b.name}
        </button>
      `).join('');

      if (rol_id === 1) {
        html += `<button class="panel-btn" onclick="location.href='admin.html'">👑 Admin</button>`;
      }

      document.getElementById('panelButtonsContainer').innerHTML = html;
      loginView.classList.add('hidden');
      panelView.classList.remove('hidden');
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const { error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) throw error;
        checkSession();
      } catch (err) {
        alertDiv.textContent = err.message || 'Error al iniciar sesión';
        alertDiv.style.display = 'block';
      }
    });

    logoutBtn.addEventListener('click', async () => {
      await supabase.auth.signOut();
      showLogin();
    });

    checkSession();
  </script>
</body>
</html>
