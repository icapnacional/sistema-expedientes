<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Crear Usuario — ICAP Admin</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #fafafa;
      font-family: 'Inter', sans-serif;
      color: #2d2d2d;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: white;
      border-radius: 16px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 480px;
      padding: 40px 32px;
      text-align: left;
      border: 1px solid #eee;
    }
    .logo {
      width: 80px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .subtitle {
      color: #777;
      font-size: 14px;
      margin-bottom: 24px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      font-size: 14px;
    }
    input, select, button {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #722F37;
      box-shadow: 0 0 0 3px rgba(114, 47, 55, 0.1);
    }
    select { cursor: pointer; }
    .btn {
      background-color: #722F37;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 12px;
    }
    .btn:hover:not(:disabled) {
      background-color: #5e262d;
      transform: translateY(-2px);
    }
    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .alert {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      display: none;
    }
    .alert-success {
      background-color: #e6f7ee;
      color: #1e703e;
      border: 1px solid #b3e6c7;
    }
    .alert-error {
      background-color: #fff5f5;
      color: #c00;
      border: 1px solid #ffd0d0;
    }
    .back-btn {
      display: inline-block;
      font-size: 14px;
      color: #722F37;
      text-decoration: none;
      margin-top: 12px;
    }
    .back-btn:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <img 
      src="https://raw.githubusercontent.com/icapnacional/sistema-expedientes/main/Logo.png" 
      alt="ICAP Nacional" 
      class="logo"
    />
    <h1>➕ Crear Nuevo Usuario</h1>
    <p class="subtitle">Solo administradores. El usuario recibirá sus credenciales por otros medios.</p>

    <form id="createForm">
      <div class="form-group">
        <label for="email">Correo Institucional *</label>
        <input type="email" id="email" required placeholder="ejemplo@icap.gob.ve">
      </div>
      <div class="form-group">
        <label for="password">Contraseña *</label>
        <input type="password" id="password" required minlength="8" placeholder="Mín. 8 caracteres">
      </div>
      <div class="form-group">
        <label for="rol_id">Rol *</label>
        <select id="rol_id" required>
          <option value="">— Seleccionar —</option>
          <option value="1">Administrador</option>
          <option value="2">Coordinador</option>
          <option value="3">Usuario Operativo</option>
        </select>
      </div>
      <div class="form-group">
        <label for="estados">Estados Asignados (separados por comas)</label>
        <input type="text" id="estados" placeholder="Zulia, Lara, Mérida" />
        <small style="color:#777; font-size:12px;">Ej: Zulia, Lara — Dejar vacío si aplica a todos</small>
      </div>
      <button type="submit" id="submitBtn" class="btn">Crear Usuario</button>
      <a href="index.html" class="back-btn">← Volver al panel</a>
    </form>

    <div id="alertMessage" class="alert"></div>
  </div>

  <script>
    const SUPABASE_URL = 'https://stwriaubepeugobgyxjt.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN0d3JpYXViZXBldWdvYmd5eGp0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTQ3NDU0MDUsImV4cCI6MjA3MDMyMTQwNX0.3Rorn10j19M2nmmv03oSEwm-O-y0bsywAA8_CRR2O1g';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const form = document.getElementById('createForm');
    const submitBtn = document.getElementById('submitBtn');
    const alertDiv = document.getElementById('alertMessage');

    async function checkAdmin() {
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) {
        window.location.href = 'index.html';
        return false;
      }
      const { data: perfil, error } = await supabase
        .from('usuarios_perfil')
        .select('rol_id')
        .eq('user_id', session.user.id)
        .single();
      if (error || !perfil || perfil.rol_id !== 1) {
        window.location.href = 'index.html';
        return false;
      }
      return true;
    }

    function showAlert(msg, type = 'error') {
      alertDiv.textContent = msg;
      alertDiv.className = `alert alert-${type}`;
      alertDiv.style.display = 'block';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!await checkAdmin()) return;

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const rol_id = parseInt(document.getElementById('rol_id').value);
      const estadosRaw = document.getElementById('estados').value.trim();

      let estados_asignados = [];
      if (estadosRaw) {
        estados_asignados = estadosRaw.split(',').map(e => e.trim()).filter(e => e);
      }

      submitBtn.disabled = true;
      alertDiv.style.display = 'none';

      try {
        // ✅ Paso 1: Crear usuario en Auth
        const { data: authData, error: signUpError } = await supabase.auth.signUp({
          email,
          password,
          options: {
            data: { created_by_admin: true }
          }
        });

        if (signUpError) throw signUpError;
        if (!authData.user) throw new Error('No se creó el usuario.');

        const newUser = authData.user;

        // ✅ Paso 2: Insertar en `usuarios_perfil`
        const { error: perfilError } = await supabase
          .from('usuarios_perfil')
          .insert({
            user_id: newUser.id,
            rol_id: rol_id,
            estados_asignados: estados_asignados.length ? estados_asignados : null,
            active_session_token: null
          });

        if (perfilError) {
          // ⚠️ Si falla perfil, intentamos borrar el usuario para no dejar basura
          await supabase.auth.admin.deleteUser(newUser.id);
          throw new Error(`Usuario creado, pero fallo al asignar perfil: ${perfilError.message}`);
        }

        showAlert(`✅ Usuario creado exitosamente.\n📧 ${email}\n🔑 Rol: ${rol_id}`, 'success');
        form.reset();
      } catch (err) {
        console.error(err);
        showAlert(err.message || 'Error al crear usuario.', 'error');
      } finally {
        submitBtn.disabled = false;
      }
    });

    // Inicializar
    checkAdmin();
  </script>
</body>
</html>
